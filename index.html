<style>
/* Softanza Radar, built with Lookout. The reading laws of the estate's sites, applied:
   - one reading size (19 px) and nothing below 16 px; secondary text is a readable tone, never small-and-grey;
   - one scroll bar on screen (Zane Rules 14 and 92), nothing scrolls sideways at 375 px;
   - no motion while navigating; a bar never covers content; no tabs that hide content (Rule 12).
   The palette is the Compass palette the estate's sites share (teal accent, serif titles). */
:root{
  --bg:#F6F8F8; --panel:#FFFFFF; --tint:#EAF4F4; --ink:#10262A; --ink2:#34474B; --lab:#56686B; --line:#CFDCDD; --cta:#6B2FA0; --cta-ink:#FFFFFF;
  --accent:#1B6B72; --accent-ink:#FFFFFF; --deep:#0E4E54;
  --lv-info:#6250D6; --lv-advice:#2A9D8F; --lv-action:#D97706; --lv-urgent:#B42318;
  /* level colours: checked with the dataviz palette checker, every pair, on the white card (worst colour-blind dE 13.2) */
  --lv-info-on:#FFFFFF; --lv-advice-on:#10262A; --lv-action-on:#10262A; --lv-urgent-on:#FFFFFF;
  --f-title:"Source Serif 4", Georgia, serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --read:1.3125rem;  /* 21 px: the author found 19 small (2026-11-09) */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1617; --panel:#122022; --tint:#16292C; --ink:#E3F1F2; --ink2:#B9CFD2; --lab:#9DB2B5; --line:#28403F; --cta:#C4A3EC; --cta-ink:#1A0B2E;
  --accent:#8FD3D8; --accent-ink:#0C1617; --deep:#5FB6BC;
  --lv-info:#8478E0; --lv-advice:#1E9C89; --lv-action:#C98500; --lv-urgent:#E04848;
  --lv-info-on:#0C1617; --lv-advice-on:#0C1617; --lv-action-on:#0C1617; --lv-urgent-on:#0C1617; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1617; --panel:#122022; --tint:#16292C; --ink:#E3F1F2; --ink2:#B9CFD2; --lab:#9DB2B5; --line:#28403F; --cta:#C4A3EC; --cta-ink:#1A0B2E;
  --accent:#8FD3D8; --accent-ink:#0C1617; --deep:#5FB6BC;
  --lv-info:#8478E0; --lv-advice:#1E9C89; --lv-action:#C98500; --lv-urgent:#E04848;
  --lv-info-on:#0C1617; --lv-advice-on:#0C1617; --lv-action-on:#0C1617; --lv-urgent-on:#0C1617; color-scheme:dark }

*{box-sizing:border-box}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font:400 var(--read)/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
/* a workstation site: the frame uses a wide screen (author, 2026-11-09), while reading columns keep their own measure */
.wrap{max-width:1760px;margin:0 auto;padding-left:max(16px,2vw,env(safe-area-inset-left,0px));padding-right:max(16px,2vw,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
html.locked,html.locked body{overflow:hidden}

/* the pinned head: level 1 = the views, level 2 = who is reading */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.row1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand nav help";align-items:center;gap:8px 28px;padding-block:12px 8px}
.row1 .brand{grid-area:brand}.row1 nav{grid-area:nav}.row1 .tools{grid-area:help;display:flex;align-items:center;gap:14px}
/* the GitHub mark, top right: an icon button, the one place a tooltip belongs */
.gh{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--ink)}
.gh:hover{color:var(--accent);background:var(--tint)}
@media (max-width:820px){.row1{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand help" "nav nav"}}
#helpOpen .short{display:none}
/* the readers' name is longer than the tool's: on a phone the brand steps down and the help button says Help, so the two never meet */
@media (max-width:520px){.brand{font-size:1.25rem}#helpOpen .long{display:none}#helpOpen .short{display:inline}}
@media (max-width:900px){.row2 .why{display:none}}
.brand{font:700 1.5rem/1 var(--f-title);color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.brand .bn{color:var(--ink)}
/* the brand with a wordmark: Softanza's own logo, then "Radar" set in the same spaced capitals */
#brand{display:flex;align-items:center;gap:.55em}
#brand .logo{display:none;height:22px;width:auto}
#brand.haslogo .logo.lt{display:block}#brand.haslogo .bn{display:none}
#brand.haslogo .rest{font:500 1.375rem/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--deep)}
:root[data-theme="dark"] #brand.haslogo .logo.lt{display:none}:root[data-theme="dark"] #brand.haslogo .logo.dk{display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #brand.haslogo .logo.lt{display:none} :root:not([data-theme="light"]) #brand.haslogo .logo.dk{display:block} }
:root[data-theme="dark"] #brand.haslogo .rest{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #brand.haslogo .rest{color:var(--accent)} }
@media (max-width:520px){#brand .logo{height:16px}#brand.haslogo .rest{font-size:1rem}}
nav.views{display:flex;flex-wrap:wrap;gap:4px 20px}
/* the menu reads as separate entries, not as one sentence (author, 2026-11-09): a visible rule between entries,
   and white space alone between the brand and the menu */
nav.views a{position:relative}
nav.views a + a::before{content:"";position:absolute;left:-11px;top:50%;height:1.1em;margin-top:-.64em;border-left:2px solid color-mix(in srgb,var(--ink2) 45%,transparent)}
@media (min-width:821px){.row1 nav.views{margin-left:28px}}   /* the brand and the menu: white space, no rule (author, 2026-11-09) */
nav.views a{font-weight:400;color:var(--ink);text-decoration:none;padding:4px 0;border-bottom:3px solid transparent;font-size:1.1875rem}
nav.views a[aria-current="page"]{border-bottom-color:var(--accent);color:var(--deep)}
:root[data-theme="dark"] nav.views a[aria-current="page"]{color:var(--accent)}
.help{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:1.125rem}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:6px 12px;font-size:1.125rem}
.row2 .lab{font-weight:600;color:var(--ink2)}
.seg{display:inline-flex;flex-wrap:nowrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 14px;cursor:pointer;font-size:1.125rem;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row2 .why{color:var(--ink2)}
#readerSel{display:none}
/* on a phone the pinned header and the help keep their compact size, so the reading text has the screen */
@media (max-width:520px){nav.views a,.help,.row2,.row2 .lab,#readerSel,.seg a,.seg button{font-size:1rem}
  /* six entries as two rows of three, never one alone: a full-width break after the third, each rule beside its entry */
  nav.views{display:flex;flex-wrap:wrap;gap:2px 20px}
  nav.views::before{content:"";flex-basis:100%;order:1;height:0}
  nav.views a:nth-child(n+4){order:2}
  nav.views a:nth-child(4)::before{display:none}
  .helpbox dl{font-size:1rem}.helpbox dd{font-size:1rem}
  #aboutLab{display:none}.seg a{padding:5px 11px}}
@media (max-width:520px){#readers{display:none}#readerSel{display:inline-block}.row2{flex-wrap:nowrap}
  .facts{display:grid;grid-template-columns:1fr 1fr}.fact{min-width:0}}

/* the reading measure, everywhere: a line of prose stops near 78 characters, whatever the width of its container */
main :is(p,li,dd,figcaption,summary,.lede){max-width:78ch}
/* reading pages: a steering column on the left, the text at a reading measure beside it, both from the header's edge */
.railpage{display:grid;grid-template-columns:minmax(0,54rem) 17rem;gap:56px;align-items:start}
.railpage > .railmain{grid-column:1;grid-row:1;min-width:0}
.railpage.wide{grid-template-columns:minmax(0,1fr) 17rem}
.rail{grid-column:2;grid-row:1;position:sticky;top:calc(var(--head,150px) + 24px);display:flex;flex-direction:column;gap:28px}
/* Zane's outline (stzzui site/stz.css, nav.list3.sections): the label grey and plain, outside the line; entries in ink,
   no underline, one line each; the pointer turns an entry to the link colour; the section being read is bold */
.rail .outline-title{margin:0 0 .8rem;font-weight:400;font-size:1rem;color:var(--ink2)}
.outline ul{list-style:none;margin:0;padding:0 0 0 .9rem;border-left:1px solid var(--line)}
.outline li{margin:0;max-width:none}
.outline a{display:block;padding:.3rem .6rem;color:var(--ink);text-decoration:none;font-size:1.125rem;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline a:hover{color:var(--deep)}
.outline a[aria-current]{font-weight:700;color:var(--ink)}
ul.points{margin:0 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.filterbox{margin:0 0 6px}
.filterbox .plab{margin:0 0 8px;font-size:1rem;color:var(--ink2)}
.filterbox .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.filterbox .filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.railtools .filters{display:flex;flex-direction:column;align-items:stretch;gap:12px;border:0;padding:0;margin:0}
.railtools .period{margin:0;font-size:1.125rem;color:var(--ink2)}.railtools .period b{display:none}.railtools .period select{margin:0 0 6px;display:block}
@media (max-height:640px){.rail{position:static}}
/* a narrow screen: the tools go above the text, the outline below it, as Zane's site does */
@media (max-width:1000px){.railpage{grid-template-columns:minmax(0,1fr);gap:20px}.rail{display:contents}
  .railtools{grid-row:1}.railpage > .railmain{grid-row:2}.outline{grid-row:3;padding-top:1.6rem}
  .outline ul{border-left:0;padding-left:0}
  .railtools .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}}
@media (max-width:560px){.railtools .filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* For your project: what you get, as the page's normal text -- a lead line and a bullet list per group */
.vtext p{margin:14px 0 6px}
.vtext ul{margin:0 0 6px;padding-left:22px;display:flex;flex-direction:column;gap:6px}/* the bar's preview drawn as another site: a browser frame at a site's width, a mock page under the bar */
.pvlab{color:var(--ink2)}
.colours{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}.colours .plab{flex-basis:100%;font-weight:600}
.colours .col1{display:flex;align-items:center;gap:6px;font-weight:400}.colours input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.browser{max-width:760px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 6px 24px rgba(16,38,42,.12);margin:6px 0 18px}
.browser .bbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#E9ECEC;border-bottom:1px solid #D5DADA}
.browser .bbar i{width:10px;height:10px;border-radius:50%;background:#C5CCCC}
.browser .burl{margin-left:10px;flex:1;background:#fff;border-radius:6px;padding:2px 10px;font-size:1rem;color:#5B6B6E}
.browser .bpage{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;background:#fff}
.browser .bh{height:18px;width:45%;border-radius:4px;background:#DDE3E3}
.browser .bl{height:10px;border-radius:4px;background:#ECEFEF}.browser .bl.short{width:60%}
/* the front page's way in for adopters */
/* the way in for adopters: one softly outlined box -- the offer and its reason on the left, the action on the right */
/* as wide as its content, never stretched to the screen (author, 2026-11-09): the button stands beside the text */
.homeadopt{margin:28px 0 44px;padding:22px 26px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:16px 36px;width:fit-content;max-width:100%}
.homeadopt .adtext{flex:0 1 40rem;min-width:0}
.homeadopt h2{margin:0 0 6px;font:700 1.6rem/1.2 var(--f-title)}
.homeadopt p{margin:0;font-size:1.25rem;color:var(--ink2)}
.homeadopt a.btn{text-decoration:none}/* the front page: the hero in two halves (text, live radar), then one row of three columns */
/* the whole hero -- promise and radar -- fits the window under the header at 100% zoom (author, 2026-11-09): its
   height is the window's, the radar takes what its pane has left, and the type steps with the window's height */
.hero .wrap{padding-block:clamp(16px,3vh,40px)}
.herogrid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:56px;align-items:stretch;
  height:calc(100svh - var(--head,76px) - 1px);min-height:34rem;box-sizing:border-box}
.herotext{align-self:center}
.heroradar{display:flex;flex-direction:column;min-height:0}
.heroradar > div{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.hero h1{font-size:clamp(1.9rem,min(3.4vw,4.7vh),3.2rem);max-width:none;margin-bottom:clamp(10px,1.8vh,18px)}
/* the promise keeps the site's reading size at any window height (author, 2026-11-09: "this text is small again"); the title gives way instead */
.hero .lede{max-width:60ch;font-size:1.375rem}
.hero .cta{margin:clamp(14px,2.8vh,28px) 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.hero .cta a{text-decoration:none;display:inline-block}   /* the border marks it as the way in; no underline on top (one emphasis) */
.hero .cta a.out{color:var(--deep);font-size:1.1875rem;text-decoration:underline}
.hero .herofact{text-wrap:balance;margin:clamp(12px,3.6vh,44px) 0 0;font:600 1.125rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--deep)}
/* the week's figures in a softly outlined box, set a little lower, so they read as one group of facts */
.hero .herofacts{margin-top:10px;max-width:40rem;border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.heroradar h2{font:700 1.4rem/1.2 var(--f-title);margin:0 0 6px}
.heroradar .radarstage{position:relative;flex:1 1 0;min-height:14rem}
.homecols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;padding-block:40px 28px}
.homecol{padding-top:0}
.homecol h2{font:700 1.6rem/1.2 var(--f-title);margin:0 0 14px}
.homecol p{margin:0;font-size:1.25rem;line-height:1.55}
.homecol ul{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:12px;font-size:1.25rem;line-height:1.5}
@media (max-width:1100px){.herogrid{grid-template-columns:minmax(0,1fr);gap:32px;height:auto;min-height:0}.hero h1{max-width:24ch}.heroradar{max-width:46rem}
  .heroradar .radarstage{flex:none;aspect-ratio:6/5;min-height:0}}
@media (max-width:900px){.homecols{grid-template-columns:minmax(0,1fr);gap:32px}}/* page heads */
.head{background:var(--tint);border-bottom:1px solid var(--line)}
.head .wrap{padding-block:28px 26px}
.eyebrow{font:600 1.125rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--deep);margin:0 0 8px}
:root[data-theme="dark"] .eyebrow{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .eyebrow{color:var(--accent)} }
h1{font:700 clamp(1.75rem,3.2vw,2.5rem)/1.15 var(--f-title);margin:0 0 12px;max-width:30ch;text-wrap:balance}
h1 .sent{display:block;text-wrap:balance}   /* one sentence, one block: lines break inside a sentence, never across two */
/* lines in equilibrium (Zane amendment docket F-1, the author's recurring remark): a title balances its lines, and no
   paragraph, list item or label leaves one short word alone on its last line */
h1,h2,h3,h4,.card h3,.ititle,.fnode b,
p,li,dd,dt,figcaption,summary,.lede,.finding,.notice,.kindline,.ihint,.fnode span,.hint,.q{text-wrap:balance}
/* and everywhere else, by default: no text on this site ends on a word alone (the author, again on 2026-11-09, on a
   chart label). "pretty" is inherited, so a block nobody listed above is covered too */
body{text-wrap:pretty}
.keyfigs span,.fact,td,th,.hlab{text-wrap:balance}   /* short labels of two lines: two even lines, never one word under the rest */
.lede{max-width:88ch;margin:0;color:var(--ink);font-size:1.375rem;line-height:1.5}
.lede+.lede{margin-top:10px}
h2{font:700 1.5rem/1.2 var(--f-title);margin:0 0 12px}
h3{font:700 1.25rem/1.25 var(--f-title);margin:0}
section.block{padding-block:28px 8px}
/* Zane Rule 8 across the site: one primary axis, read top to bottom; figures in one aligned row, no boxes */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:12px;margin-top:18px;padding:4px 0;max-width:64rem}
.fact{min-width:0}
.fact b{display:block;font:700 1.75rem/1.1 var(--f-title);color:var(--deep)}
:root[data-theme="dark"] .fact b{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fact b{color:var(--accent)} }

/* this week */
/* the radar page, on the author's ruling (2026-11-09): the radar holds the left half, enlarged and fixed in view,
   the list fills the right half and is what moves. The page keeps ONE scroll bar: the radar is sticky, so the page's
   own scroll moves only the list. On a narrow screen the radar sits above the list. */
.week{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.week .scope{position:sticky;top:calc(var(--head,150px) + 16px);display:flex;flex-direction:column;height:calc(100vh - var(--head,150px) - 32px)}
/* inside the pinned card, the radar takes the height that is left once the line above, the info bar, the legend and
   the slice names have theirs, so everything stays inside the card at any window height */
.week .scope > div{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.week .radarstage{flex:1 1 0;min-height:9rem;position:relative}
.week .scope svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.week .scope{position:static;height:auto}.week .radarstage{flex:none;aspect-ratio:1/1;min-height:0}}
/* a window too short to hold the whole card pinned: the card stays at full size and scrolls with the page */
@media (max-height:759px){.week .scope{position:static;height:auto}.week .radarstage{flex:none;aspect-ratio:1/1;min-height:0}}
.scope{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(16,38,42,.06)}
.scope svg{width:100%;height:auto;display:block}
.scope .lbl{font:700 22px var(--f-body);fill:var(--ink2)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 2px 0;font-size:1.125rem;color:var(--ink2)}
.key span{white-space:nowrap}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.blip{cursor:pointer}
.blip:focus-visible circle.halo,.blip:hover circle.halo{stroke-width:4}
.blip:focus{outline:none}
/* the info bar under the radar: one height, information only; the level stands out as its tinted label */
.infobar{min-height:4.4rem;margin-top:8px;padding:8px 12px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 10px 10px 0;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.infobar.on{border-left-color:var(--accent)}
.infobar .ihint{color:var(--ink2);font-size:1.1875rem}
.blip.picked circle.halo{stroke-width:4}
.infobar .iopen{color:var(--deep);text-decoration:underline;font-size:1.125rem;white-space:nowrap}
.infobar .ititle{font:700 1.0625rem/1.35 var(--f-title);flex:1 1 14rem;min-width:0}
/* the card's own words (title and hint) and the drawing's labels are two levels of reading: a clear gap between them,
   about twice the line height, so the slice names never read as part of the hint (author, 2026-11-09) */
.radarhint{margin:0 0 clamp(18px,3.2vh,32px);font-size:1.1875rem;line-height:1.4;color:var(--ink2)}
/* around the rim, each slice's number sits just outside it and its name runs outward from the number, as plain text
   (author, 2026-11-09: labels are not links) */
.radarstage .sl{position:absolute;display:flex;align-items:center;gap:.4em;font-size:1.125rem;line-height:1.25;color:var(--lab)}
.radarstage .sl.one span{max-width:none;white-space:nowrap}
.radarstage .sl[hidden]{display:none}
.radarstage .sl.numonly span{display:none}   /* display:flex above would otherwise show a label the code has hidden */
.radarstage .sl.left{flex-direction:row-reverse;text-align:right}
/* the number stands on the line nearest the circle, so a second line of the name runs away from it, never into it */
.radarstage .sl.up{align-items:flex-end}.radarstage .sl.down{align-items:flex-start}
.radarstage .sl b{color:var(--ink);flex:none}
.radarstage .sl span{max-width:7.5em;text-wrap:balance}
.radarstage .sl.side span{max-width:6em}   /* beside the circle a name wraps narrow, so the circle keeps its size */
.radarstage svg{display:block}
/* on a phone the names go in a numbered list under the radar */
.scope .slices{margin:10px 0 0;padding-left:1.6em;font-size:1.125rem;line-height:1.5;color:var(--ink2);columns:2;column-gap:24px}
.group{margin-bottom:22px}
.group>h3{font:700 1.125rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:6px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(16,38,42,.06)}
.card .stripe{background:var(--lv-info)}
.card .body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:1.125rem;color:var(--ink2)}
.pill{border:1px solid var(--line);border-radius:999px;padding:0 10px;white-space:nowrap;background:var(--panel)}
.pill.lv{background:color-mix(in srgb,var(--c) 13%,var(--panel));color:color-mix(in srgb,var(--c) 40%,var(--ink));border:1.5px solid var(--c);font-weight:700}   /* text at 7:1 or more, light and dark */
.kindline{color:var(--ink2);font-weight:600}
.new{color:var(--accent);font-weight:700}
.card h3{font-size:1.2rem}
.card p{margin:0}
.card p.plain{color:var(--ink2)}

/* the estate */
/* the stack is an architecture drawing, not prose: its layers stack as layers, their parts stand side by side, and the
   harness stands beside the stack (the author's ruling, 2026-11-09: the one-column rule is for text, not for this) */
.estate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,19rem);gap:20px;align-items:start}
@media (max-width:900px){.estate{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:10px}
.layer{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(16,38,42,.06)}
@media (max-width:700px){.layer{grid-template-columns:minmax(0,1fr)}}
.layer .name p{margin:4px 0 0;color:var(--ink2);font-size:1.125rem}
.projects{display:flex;flex-wrap:wrap;gap:10px}
.proj{flex:1 1 15rem;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:inherit;text-decoration:none;background:var(--bg)}
.proj b{font-family:var(--f-title);font-size:1.15rem}
.proj p{margin:4px 0 0;color:var(--ink2);font-size:1.125rem}
/* in-page links read as links: teal words, underlined, with their arrow; one emphasis, never bold as well. A filled teal pill is kept for one
   meaning only, the choice selected in the pinned bars, so nothing inside a page looks like one of them. */
.concern .n,.proj .n,.card .n{display:inline-block;align-self:flex-start;margin-top:8px;color:var(--deep);font-weight:400;font-size:1.125rem;text-decoration:underline}
/* the way to a part's signals calls the eye (author, 2026-11-09): a button in Softanza's own purple, which no level
   colour and no other control uses; filled, so no underline on top (one emphasis) */
.concern a.n,.proj a.n{background:var(--cta);color:var(--cta-ink);text-decoration:none;font-weight:600;padding:6px 16px;border-radius:8px;margin-top:12px}
.concern a.n:hover,.proj a.n:hover{background:color-mix(in srgb,var(--cta) 86%,var(--ink))}
.concern a.n:focus-visible,.proj a.n:focus-visible{outline:2px solid var(--cta);outline-offset:3px}
:root[data-theme="dark"] .card .n{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card .n{color:var(--accent)} }

.beside{background:var(--tint);border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.beside .proj{flex:none}
table.grid{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:1.125rem}
table.grid th,table.grid td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle}
table.grid thead th{background:var(--tint);font-weight:700}
table.grid tbody th{text-align:left;font-weight:700;white-space:normal}
table.grid td a{display:inline-block;min-width:2.2rem;padding:2px 8px;color:var(--deep);font-weight:400;font-size:1.1875rem;text-decoration:underline}
:root[data-theme="dark"] table.grid td a{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) table.grid td a{color:var(--accent)} }
.gridlist{display:none}
@media (max-width:820px){table.grid{display:none}.gridlist{display:flex;flex-direction:column;gap:12px}}
.gridlist .dom{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--accent);border-radius:999px;padding:2px 12px;text-decoration:none;font-weight:600;font-size:1.125rem;color:var(--deep);background:var(--panel)}
:root[data-theme="dark"] .chip{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip{color:var(--accent)} }
.concerns{display:flex;flex-direction:column;max-width:64rem}
.concern{display:block;padding:14px 0;color:inherit;text-decoration:none}
.concern:first-child{border-top:0}
.concern p{margin:4px 0 0;color:var(--ink2);font-size:1.125rem}

/* all signals */
/* the six filters share the row in equal parts, in rows that always come out full: 6, then 3 + 3, then 2 + 2 + 2;
   a control never sits alone on a line while the line above has room (reported to Zane: ZANE-CONTROLROW-01) */
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 18px;align-items:end;padding:0;margin-bottom:28px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:1.125rem;min-width:0}
.filters select{width:100%}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:1.125rem;max-width:100%}
.cfg input[type=text]{font:inherit;font-size:1.125rem;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:22rem}
.count{font-weight:700;margin:0 0 12px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:20px}

/* one signal: a page, every part in view, ordered for the reader */
.sig{max-width:820px}
.sig .part{padding-block:22px 6px}
.sig .part:first-of-type{border-top:0}
.sig h2{font-size:1.35rem}
.sig p{margin:0 0 10px;max-width:80ch}
.notice{border-left:4px solid var(--accent);padding:6px 0 6px 16px;font-size:1.25rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.kv dt{color:var(--ink2);font-weight:600}
.kv dd{margin:0}
ul.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.code{position:relative;background:var(--tint);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.code .why{padding:10px 16px 0;color:var(--ink2);font-size:1.125rem}
.code pre{margin:0;padding:12px 16px 14px;font:400 1.125rem/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.copy{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:1.125rem;cursor:pointer}
.code.withcopy pre{padding-right:5.5rem}
details{border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:10px;background:var(--panel)}
details summary{cursor:pointer;font-weight:600}
details p{margin-top:8px}
.terms{display:flex;flex-direction:column;gap:8px}
.term b{font-family:var(--f-mono);font-size:1.125rem}
.back{display:inline-block;margin-bottom:10px;font-weight:600}

/* weeks */
nav.weeks{display:flex;flex-wrap:wrap;align-items:end;gap:10px 18px;margin-top:18px}
nav.weeks .step{font-weight:700}
nav.weeks .goto{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:1.125rem}

/* trends: figures in two columns on a wide screen, one on a phone */
/* trends reads as one column: chapters, each opening on its finding, the figures under it at one width */
.report{max-width:64rem}
.report .period{margin:0 0 6px;font-size:1.1875rem}
.report .period select{margin:0}
/* Trends in two clear levels (author, 2026-11-09: "separate clearly between sections"): a chapter opens under a strong
   teal rule with wide space above it; each figure inside, with its table, is one block under a thin rule */
/* chapters part by space and a thin rule, the first by space alone (the author removed the strong rule, 2026-11-09) */
h2.chap{font:700 1.75rem/1.2 var(--f-title);margin:72px 0 12px;padding-top:0}
h2.chap:first-of-type{margin-top:28px;padding-top:0;border-top:0}
.report .period{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0}
.report .period .plab{flex-basis:100%;font-size:1rem;color:var(--ink2)}
.report .period .pspan{font-size:1.125rem;color:var(--ink2)}
p.finding{font-size:1.3125rem;line-height:1.55;margin:0 0 18px;max-width:80ch}
.keyfigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 8px;padding:8px 0}
.keyfigs div{display:flex;flex-direction:column}
.keyfigs b{font:700 1.75rem/1.15 var(--f-title);color:var(--deep)}
:root[data-theme="dark"] .keyfigs b{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .keyfigs b{color:var(--accent)} }
.keyfigs span{color:var(--ink2);font-size:1.1875rem}
@media (max-width:640px){.keyfigs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{margin:44px 0 0;padding:0;min-width:0}
.keyfigs + .fig,.finding + .fig{border-top:0;padding-top:4px}
.fig .tv{margin-top:12px}
.fig h3{margin-bottom:4px;font-size:1.2rem}
.figlead{margin:0 0 12px;color:var(--ink2);font-size:1.1875rem}
.fsub{display:block;color:var(--ink2);font-size:1.125rem}
.hbars{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 2.5rem;gap:4px 12px;align-items:center;color:inherit;text-decoration:none;font-size:1.1875rem}
.hlab b{font-weight:700}
.hsub{color:var(--ink2)}
.htrack{height:14px;background:transparent;border-bottom:1px solid var(--line);display:flex;align-items:center}
.hbar{display:block;height:12px;min-width:4px;background:var(--accent);border-radius:0 4px 4px 0}
.hval{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow.wideval{grid-template-columns:minmax(0,15rem) minmax(0,1fr) 6.5rem}
@media (max-width:640px){.hrow.wideval{grid-template-columns:minmax(0,1fr) auto}.hrow{grid-template-columns:minmax(0,1fr) 2.5rem;grid-template-areas:"l v" "t t"}.hlab{grid-area:l}.hval{grid-area:v}.htrack{grid-area:t}}
.cols .plot{display:flex;align-items:flex-end;gap:10px;height:220px;border-bottom:1px solid var(--line);padding-top:24px;margin-top:10px}
.col{flex:1 1 0;max-width:72px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-decoration:none;color:inherit;position:relative}
.col .stack{display:flex;flex-direction:column;gap:2px;min-height:4px}
.col .cseg{display:block;min-height:3px}
.col .stack .cseg:first-child{border-radius:4px 4px 0 0}
.ctot{text-align:center;font-weight:700;font-size:1.125rem}
.cwk{position:absolute;bottom:-1.7rem;left:0;right:0;text-align:center;font-size:1.125rem;color:var(--ink2)}
.cols{padding-bottom:1.9rem}
.heat{display:grid;gap:3px;font-size:1.125rem}
.heat .hh{text-align:center;font-weight:700;color:var(--ink2);text-decoration:none}
.heat .hr{font-weight:600;padding-right:8px}
.heat .hc{min-height:2rem;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-weight:700}
details.tv{margin-top:14px;border:0;padding:0;background:transparent}
details.tv summary{font-size:1.125rem;color:var(--accent)}
.tbl{border-collapse:collapse;margin-top:8px;font-size:1.125rem;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.tbl td{font-variant-numeric:tabular-nums}

/* make your own */
/* Zane Rule 8: the steps, the form and the bar's settings read in one column, top to bottom */
ol.steps{list-style:none;counter-reset:st;padding:0;margin:0;max-width:64rem}
/* only the steps themselves count and space (a bullet inside a step is not a step); space alone parts them */
ol.steps > li{counter-increment:st;padding:22px 0 4px;min-width:0}
ol.steps > li:first-child{padding-top:4px}
ol.steps > li > h3::before{content:"Step " counter(st) ": ";color:var(--deep)}
:root[data-theme="dark"] ol.steps > li > h3::before{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) ol.steps > li > h3::before{color:var(--accent)} }
ol.steps li p{margin:8px 0}
ol.steps .code pre{padding-right:16px}
.tbl.learn{background:var(--panel);font-size:1.1875rem}
.tbl.learn th{white-space:nowrap;font-family:var(--f-mono);font-size:1.125rem}
.tbl.learn thead th{font-family:var(--f-body)}
@media (max-width:700px){.tbl.learn thead{display:none}.tbl.learn tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)}.tbl.learn th,.tbl.learn td{display:block;border:0;padding:2px 0}}
.builder{display:flex;flex-direction:column;gap:16px;max-width:56rem;margin-bottom:18px}
.builder h3.bq{font:700 1.25rem/1.25 var(--f-title);margin:28px 0 0;padding-top:0}
.builder h3.bq:first-child{margin-top:0;padding-top:0;border-top:0}
.builder label{display:flex;flex-direction:column;gap:6px}
.builder .q{font-weight:600;font-size:1.125rem}
.builder input,.builder textarea{width:100%;font:400 1.125rem/1.45 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.builder textarea{resize:none;overflow:hidden}
.builder .hint{font-weight:400;color:var(--ink2)}
.builder .rd{display:flex;flex-direction:column;gap:8px}
.builder .rrow{display:flex;flex-wrap:wrap;gap:6px 22px}
.builder .rrow label{flex-direction:row;align-items:center;gap:8px;font-size:1.125rem}
.builder .rrow input{width:auto}

/* the lookout.yaml window: questions on the left, the file on the right. The page beneath is frozen; the questions
   carry the one visible scroll bar; the file follows the answer being typed and scrolls without a bar of its own */
dialog.yamlbox{width:min(1400px,94vw);height:90vh;max-width:none;max-height:none;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);overflow:hidden}
dialog.yamlbox[open]{display:flex;flex-direction:column}
dialog.yamlbox::backdrop{background:rgba(16,38,42,.45)}
.yhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.yhead h2{margin:0}
.yhead form{margin:0}
.ybody{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.yleft{overflow-y:auto;overscroll-behavior:contain;padding:18px 26px 26px}
.yintro{margin:0;color:var(--ink2)}
.yright{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--tint);border-left:1px solid var(--line);padding:0 24px 24px}
.yright::-webkit-scrollbar{display:none}
.yfilehead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;background:var(--tint);border-bottom:1px solid var(--line);margin-bottom:10px}
.yfilehead b{font:600 1.0625rem var(--f-mono)}
.yacts{display:flex;gap:8px;flex-wrap:wrap}
pre.yfile{margin:0;font:400 1.125rem/1.6 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
pre.yfile .ln{display:block;padding:0 6px;border-radius:4px}
pre.yfile .ln.hl{background:color-mix(in srgb,var(--accent) 20%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
.btn.big{font-size:1.125rem;padding:10px 22px}
@media (max-width:900px){dialog.yamlbox{width:100vw;height:100dvh;border-radius:0;border:0}
  .ybody{display:block;overflow-y:auto}.yleft,.yright{overflow:visible}.yright{border-left:0;border-top:1px solid var(--line)}}

/* the About pages: the repository's documents at reading size, one column */
.doc{max-width:64rem}
.doc h2{font:700 1.6rem/1.2 var(--f-title);margin:44px 0 10px;padding-top:0}
.doc h2:first-child{margin-top:4px;padding-top:0;border-top:0}
.doc h3{margin:22px 0 8px}
.doc p{margin:0 0 14px;max-width:80ch}
.doc ul,.doc ol{margin:0 0 16px;padding-left:26px;display:flex;flex-direction:column;gap:8px;max-width:80ch}
.doc code{font-family:var(--f-mono);font-size:.92em;background:var(--tint);padding:0 4px;border-radius:4px}
.doc .code{margin:0 0 16px}
/* the flow diagram: boxes in layers, an arrow between layers */
.flow{margin:6px 0 22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.flayer{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.fnode{flex:0 1 15.5rem;min-width:0;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:10px 14px;text-align:center;display:flex;flex-direction:column;gap:2px}
.fnode.fkey{border-top-color:var(--accent)}
.fnode b{font:700 1.15rem/1.25 var(--f-title)}
.fnode span{color:var(--ink2);font-size:1.125rem}
.farrow{font-size:1.6rem;line-height:1;color:var(--accent)}
.row2[hidden]{display:none}
/* the About bar: the reader bar's buttons, as links to the section's pages; a bar never breaks its buttons */
.seg a,.seg button{white-space:nowrap}
@media (max-width:700px){#aboutLab{display:none}}
.seg a{display:inline-block;padding:5px 14px;font-size:1.125rem;font-weight:600;color:var(--ink);text-decoration:none}
.seg a + a{border-left:1px solid var(--line)}
.seg a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
/* the About bar's four pages on a phone: two full rows of two, never one alone and never cut off */
@media (max-width:560px){#aboutNav .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  #aboutNav .seg a{text-align:center}}   /* three pages in one row of three */
.doc code{overflow-wrap:anywhere}



/* the bar page */
.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin-bottom:16px}
.preview .fake{padding:14px 16px;color:var(--ink2)}
.cfg{display:flex;flex-direction:column;gap:14px;max-width:56rem;margin-bottom:16px}
.cfg label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:1.1875rem}
.cfg label select{max-width:22rem}
.cfg .picks{display:flex;flex-direction:column;gap:8px}
.cfg .plab{font-weight:600;font-size:1.125rem}
.cfg .hint{color:var(--ink2);font-size:1.125rem}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--panel);font-weight:600;font-size:1.125rem;cursor:pointer}
.tog:hover{border-color:var(--accent)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* help, and the foot */
dialog.helpbox{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px 22px;width:min(560px,calc(100% - 32px))}
dialog.helpbox::backdrop{background:rgba(16,38,42,.45)}
.helphead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.helphead h2{margin:0}
.helphead form{margin:0}
.helpbox dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 16px;font-size:1.1875rem}
.helpbox dt{font-weight:700}
.helpbox dd{margin:0;color:var(--ink2)}
@media (max-width:520px){.helpbox{padding:16px 18px}.helpbox dl{grid-template-columns:1fr;gap:2px;font-size:1.125rem;line-height:1.4}.helpbox dd{margin-bottom:8px}}

</style>

<script>
"use strict";
let FEED = null, MAP = null, LESSONS = {}, CONFIG = null, DIGESTS = [];
/* the project this watch serves, from app/config.json (lookout.yaml) */
const NAME = () => CONFIG.project.name, WATCH = () => CONFIG.watch.name, TOPIC = () => CONFIG.watch.topic;
const RADAR = () => CONFIG.watch.title || (NAME() + " " + TOPIC() + " Radar");   /* what readers see; WATCH() is the tool */
const poss = s => s + (/s$/.test(s) ? "'" : "'s");
let live = [];
const LEVELS = ["info","advice","action","urgent"];
/* the level labels, capitalized wherever they stand as labels; inside a sentence they are lowercased */
const WORD = {info:"To know", advice:"To consider", action:"To do", urgent:"To do now"};
const GROUP = {urgent:"To do now", action:"To do", advice:"To consider", info:"To know"};

/* one reader, chosen once; it decides what a card says and in which order a signal's page reads */
const READERS = {
  developer: {label:"Developer",  why:"checks and code to run in your own project come first",
              order:["notice","build","happened","learn","estate","actions","sources"]},
  maintainer:{label:"Maintainer", why:"what happened and the work proposed to the project's parts come first",
              order:["notice","happened","actions","estate","build","learn","sources"]},
  learner:   {label:"Learner",    why:"each signal opens on a lesson in plain words",
              order:["notice","learn","happened","estate","build","sources"]},
  user:      {label:"User",       why:"what happened, and what it means for the software you use",
              order:["notice","happened","learn","estate","sources"]}
};

const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const clean = s => String(s ?? "").replace(/[\u0000-\u001f\u007f]/g, " ");      /* plain text only */
const today = new Date().toISOString().slice(0,10);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
let reader = store.get("reader", store.get("role", "developer"));
if (!READERS[reader]) reader = "developer";
const seen = new Set(store.get("seen", []));

/* ------------------------------------------------------------ the map */
let ALIAS = {}, PROJ = {}, LAYER = {}, DOMAIN = {}, CONCERN = {};
function indexMap(){
  for (const l of MAP.layers) LAYER[l.id] = l;
  for (const p of MAP.projects){ PROJ[p.id] = p; ALIAS[p.id] = p.id; for (const a of (p.aliases||[])) ALIAS[a] = p.id; }
  for (const d of MAP.domains) DOMAIN[d.id] = d;
  for (const c of MAP.concerns) CONCERN[c.id] = c;
}
const projOf = a => ALIAS[a] || ALIAS[a.split(".")[0]] || null;
const projectsOf = it => [...new Set((it.areas||[]).map(projOf).filter(Boolean))];
const layersOf = it => [...new Set(projectsOf(it).map(p => PROJ[p].layer))];
/* a level reads as dark text in its own hue on a pale tint of it, with a border in the full colour: no text on a mid-tone fill */
const levelPill = lv => { const p = el("span","pill lv",WORD[lv]); p.style.setProperty("--c", "var(--lv-" + lv + ")"); return p; };
function weekOf(dateStr){
  const d = new Date(dateStr + "T00:00:00Z"); const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return d.getUTCFullYear() + "-W" + String(Math.ceil(((d - y0) / 864e5 + 1) / 7)).padStart(2,"0");
}
/* what a signal asks first, then how much it touches the project, then the newest: the order of the list and of the radar's choice */
const REL = {high:2, medium:1, low:0};
const byLevel = (a,b) => LEVELS.indexOf(b.level) - LEVELS.indexOf(a.level) || (REL[b.relevance] ?? 1) - (REL[a.relevance] ?? 1) || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
const radarLimit = () => Math.min(12, Math.max(3, Number(CONFIG?.watch?.radar_limit) || 7));

/* ------------------------------------------------------------ a card */
function card(it){
  /* one thing to click, in one place: the link at the card's foot; the card itself is not a link and does not react to
     the pointer (the author's ruling, 2026-11-09; reported to Zane as ZANE-ONELINK-01) */
  const c = el("div","card");
  const stripe = el("span","stripe"); stripe.style.background = css("--lv-"+it.level);
  const b = el("div","body"), m = el("span","meta");
  /* labels, not controls: the line reads "security · touches Softanza and Haro" */
  m.append(levelPill(it.level));
  const names = projectsOf(it).map(p => PROJ[p].name);
  const touch = names.length ? " · touches " + (names.length > 1 ? names.slice(0,-1).join(", ") + " and " + names.at(-1) : names[0]) : "";
  m.append(el("span","kindline", it.kind + touch));
  if (!seen.has(it.id)) m.append(el("span","new","new"));
  b.append(m, el("h3",null,clean(it.title)));
  const note = it.notice?.[reader];
  if (note) b.append(el("p",null,clean(note)));
  else b.append(el("p","plain",clean((LESSONS[it.id]?.lesson || it.summary).split(". ")[0].replace(/\.$/,"") + ".")));
  const go = el("a","n","Open this signal →"); go.href = "#/signal/" + it.id; b.append(go);
  c.append(stripe, b); return c;
}
/* A title of several sentences sets each sentence on its own line(s), balanced within itself, so a line never breaks
   in the middle of one sentence to start the next (author, 2026-11-09: "bad line cuts AGAIN and AGAIN"). */
function titleEl(text){
  const h = el("h1"), parts = String(text).match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [text];
  if (parts.length < 2){ h.textContent = text; return h; }
  for (const t of parts) h.append(el("span","sent",t.trim()));
  return h;
}
/* A page head: an optional line of information above the title (the week and its dates), never a path: the two
   pinned bars already mark every level of this site, so a path would say them again (Zane Rule 108) */
function head(eyebrow, title, ledes){
  const h = el("div","head"), w = el("div","wrap");
  if (eyebrow) w.append(el("p","eyebrow",eyebrow));
  w.append(titleEl(title));
  for (const l of ledes) w.append(typeof l === "string" ? el("p","lede",l) : l);
  h.append(w); return h;
}

/* short labelled points instead of a dense paragraph (author, 2026-11-09): a bold label, then one short sentence */
function points(rows){ const ul = el("ul","points"); for (const [k, v] of rows){ const li = el("li"); li.append(el("b",null,k), document.createTextNode(" " + v)); ul.append(li); } return ul; }

/* ------------------------------------------------------------ the reading-page layout, as on Zane's own site
   The text starts at the header's left edge and keeps a reading measure. On its right, a column that stays in view:
   at its top what steers the page (the filters, the period), and under it "On this page", Zane's outline -- a grey
   label, a thin line, one entry per section in the body ink, the section being read in bold (the author, 2026-11-09:
   "use the same 'On this page' submenu we used in the Zane website"). */
function railPage(main, opt = {}){
  const s = el("section","block wrap railpage" + (opt.wide ? " wide" : "")), aside = el("aside","rail");
  if (opt.tools){ const t = el("div","railtools"); if (opt.label) t.append(el("p","outline-title",opt.label)); t.append(...opt.tools); aside.append(t); }
  if (opt.outline && opt.outline.querySelector("li")){
    const nav = el("nav","outline"); nav.setAttribute("aria-label","Sections of this page");
    nav.append(el("p","outline-title","On this page"), opt.outline); aside.append(nav);
    spyOn(opt.outline);
  }
  s.append(main, aside); return s;
}
/* a page of several sections gets "On this page" (author, 2026-11-09): its sections go into the reading column and
   the outline lists their headings. A page whose drawing needs the width keeps a flexible column (wide). */
function outlined(frag, wide){
  const kids = [...frag.childNodes], top = kids.shift(), main = el("div","railmain");
  for (const k of kids){ k.classList?.remove("wrap"); main.append(k); }
  const out = document.createDocumentFragment(); out.append(top, railPage(main, {outline: contentsOf(main, "h2"), wide}));
  return out;
}
/* the page's own sections: one entry per heading, each scrolling to it (the hash belongs to the router) */
function contentsOf(main, sel){
  const ul = el("ul");
  main.querySelectorAll(sel).forEach(h => {
    const t = h.textContent.replace(/^\d+\.\s*/,"");
    const a = el("a",null,t); a.href = location.hash || "#/"; a.title = t; a._target = h;
    a.addEventListener("click", e => { e.preventDefault(); h.scrollIntoView({block:"start"}); });
    const li = el("li"); li.append(a); ul.append(li);
  });
  return ul;
}
/* the entry of the section being read is marked, as Zane's outline marks it: the last heading above the reading line */
let spyList = null;
function spyOn(ul){ spyList = ul; setTimeout(spy, 0); }
function spy(){
  if (!spyList || !spyList.isConnected) return;
  const line = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--head")) || 120) + 40;
  let cur = null;
  for (const a of spyList.querySelectorAll("a")) if (a._target.getBoundingClientRect().top <= line) cur = a;
  cur = cur || spyList.querySelector("a");
  for (const a of spyList.querySelectorAll("a")) a.toggleAttribute("aria-current", a === cur);
}
addEventListener("scroll", spy, {passive:true});
/* ------------------------------------------------------------ view: the front page
   What the watch is for, before any week. The hero holds two halves (author, 2026-11-09: "use the space"): on the
   left the promise, the two ways in and this week's key figures; on the right this week's radar itself, live, so a
   reader can hover a signal and open it from the first screen. Below, why it exists, what it answers and what it
   gives stand as one row of three columns. Every word comes from lookout.yaml's home section. */
function viewHome(){
  const H = CONFIG.home, frag = document.createDocumentFragment();
  const weeks = weeksAll(), wk = weeks.find(x => DIGESTS.includes(x)) || weeks[0];
  const items = FEED.items.filter(i => weekOf(i.date) === wk && i.status !== "superseded").sort(byLevel);
  const hero = el("div","head hero"), w = el("div","wrap herogrid"), txt = el("div","herotext");
  const go = el("a","btn big","See this week on the radar →"); go.href = "#/week";
  const site = link("Visit the " + NAME() + " website ↗", CONFIG.project.site); site.className = "out";   /* ↗: it leaves this site */
  const cta = el("p","cta"); cta.append(go, site);
  const facts = el("div","facts herofacts");
  const fact = (n, t) => { const f = el("div","fact"); f.append(el("b",null,String(n)), document.createTextNode(t)); facts.append(f); };
  fact(items.length, items.length === 1 ? "signal this week" : "signals this week");
  fact(items.filter(i => i.level === "action" || i.level === "urgent").length, "to do");
  fact(new Set(items.flatMap(projectsOf)).size, "projects touched");
  txt.append(titleEl(H.headline), el("p","lede",H.promise), cta, el("p","herofact","Week " + wk + ", " + weekSpan(wk)), facts);
  const pane = el("div","scope heroradar");
  pane.append(el("h2",null,"This week across " + NAME()), radar(items.slice(0, radarLimit()), items.length));
  w.append(txt, pane); hero.append(w); frag.append(hero);
  const outer = el("div","wrap"), cols = el("div","homecols"); outer.append(cols);
  const list = xs => { const ul = el("ul"); for (const t of xs) ul.append(el("li",null,t)); return ul; };
  const col = (t, ...kids) => { const c = el("section","homecol"); c.append(el("h2",null,t), ...kids); cols.append(c); };
  col("Why it exists", Array.isArray(H.why) ? list(H.why) : el("p",null,H.why));   /* short points, not a dense paragraph (author, 2026-11-09) */
  col("What it answers", list(H.need));
  col("What it gives", list(H.value));
  /* a way in for a project that wants its own radar (author, 2026-11-09: adopting must be a clear message) */
  /* the offer said plainly, and a button that says what it does (author, 2026-11-09) */
  const ad = el("div","homeadopt"), adt = el("div","adtext"), go2 = el("a","btn big","Make your own radar →"); go2.href = "#/yours";
  adt.append(el("h2",null,"Run this radar for your own project"),
    el("p",null,"Lookout, the open tool behind " + RADAR() + ", reads your field every week and tells your team, your apps and your users what it means for them, in your project's name and from one file."));
  ad.append(adt, go2);
  outer.append(ad);
  frag.append(outer);
  return frag;
}
/* ------------------------------------------------------------ view: this week */
/* every week that holds an entry, newest first; a past week keeps its entries even after their review date */
const weeksAll = () => [...new Set(FEED.items.map(i => weekOf(i.date)))].sort().reverse();
function weekSpan(wk){
  const [y, w] = wk.split("-W").map(Number);
  const jan4 = new Date(Date.UTC(y,0,4)), mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (w - 1) * 7);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  const f = (d, o) => d.toLocaleDateString("en-GB", Object.assign({timeZone:"UTC"}, o));
  return mon.getUTCMonth() === sun.getUTCMonth() ? f(mon,{day:"numeric"}) + " to " + f(sun,{day:"numeric",month:"long",year:"numeric"})
                                                 : f(mon,{day:"numeric",month:"long"}) + " to " + f(sun,{day:"numeric",month:"long",year:"numeric"});
}
function viewWeek(wkArg){
  const weeks = weeksAll();
  /* with no week asked for, the newest week a survey has closed (it has a digest); a newer week stays one step ahead */
  const surveyed = weeks.find(w => DIGESTS.includes(w)) || weeks[0];
  const wk = weeks.includes(wkArg) ? wkArg : surveyed;
  const latest = wk === surveyed;
  const items = FEED.items.filter(i => weekOf(i.date) === wk && i.status !== "superseded").sort(byLevel);
  const frag = document.createDocumentFragment();
  const h = head("Week " + wk + " · " + weekSpan(wk),
    wk >= surveyed ? CONFIG.watch.tagline : (CONFIG.watch.tagline_past || "What changed in {topic} in week {week}").replace("{topic}", TOPIC()).replace("{week}", wk),
    [CONFIG.watch.intro]);
  /* the week stepper: the weeks that hold signals, one step at a time, or any of them from the list */
  const nav = el("nav","weeks"); nav.setAttribute("aria-label","Weeks");
  const i = weeks.indexOf(wk);
  if (i < weeks.length - 1){ const a = el("a","step","← Week " + weeks[i + 1]); a.href = "#/week/" + weeks[i + 1]; nav.append(a); }
  if (i > 0){ const a = el("a","step","Week " + weeks[i - 1] + " →"); a.href = "#/week/" + weeks[i - 1]; nav.append(a); }
  const lab = el("label","goto"); lab.append(document.createTextNode("Go to week"));
  const sl = el("select"); for (const w of weeks){ const n = FEED.items.filter(x => weekOf(x.date) === w).length; sl.append(new Option(w + " · " + plural(n,"signal"), w)); }
  sl.value = wk; sl.addEventListener("change", () => { location.hash = "#/week/" + sl.value; }); lab.append(sl); nav.append(lab);
  const facts = el("div","facts");
  const fact = (n, w) => { if (n > 0){ const f = el("div","fact"); f.append(el("b",null,String(n)), document.createTextNode(w)); facts.append(f); } };
  fact(items.length, items.length === 1 ? (latest ? "signal this week" : "signal that week") : (latest ? "signals this week" : "signals that week"));
  fact(items.filter(i => i.level === "action" || i.level === "urgent").length, "to do");
  fact(items.filter(i => i.notice?.[reader]).length, "written for a " + reader);
  fact(new Set(items.flatMap(projectsOf)).size, "projects touched");
  h.querySelector(".wrap").append(facts, nav);
  frag.append(h);
  const s = el("section","block wrap week");
  const scope = el("div","scope"); scope.append(el("h2",null,"The week across " + NAME()), radar(items.slice(0, radarLimit()), items.length));   /* a few, each worth a look (docs/METHOD.md) */
  const list = el("div");
  for (const lv of ["urgent","action","advice","info"]){
    const g = items.filter(i => i.level === lv); if (!g.length) continue;
    const grp = el("div","group"); grp.append(el("h3",null,GROUP[lv] + " (" + g.length + ")"));
    const cs = el("div","cards"); for (const it of g) cs.append(card(it)); grp.append(cs); list.append(grp);
  }
  s.append(scope, list); frag.append(s);
  return frag;
}

function radar(items, total = items.length){
  const NS = "http://www.w3.org/2000/svg", mk = (t, a) => { const e = document.createElementNS(NS,t); for (const k in a) e.setAttribute(k,a[k]); return e; };
  const svg = mk("svg",{viewBox:"0 0 440 440",role:"img","aria-label":"Radar: each slice is a layer of " + NAME() + "; the closer to the centre, the more relevant"});
  const C = 220, R = {high:72, medium:122, low:168}, layers = MAP.layers, n = layers.length, step = 360 / n;
  svg.append(mk("circle",{cx:C,cy:C,r:186,fill:css("--tint"),stroke:css("--line")}));
  for (const r of Object.values(R)) svg.append(mk("circle",{cx:C,cy:C,r,fill:"none",stroke:css("--line"),"stroke-dasharray":"4 6"}));
  layers.forEach((l, i) => {
    const a = (i * step) * Math.PI / 180;
    svg.append(mk("line",{x1:C,y1:C,x2:C + 186*Math.sin(a),y2:C - 186*Math.cos(a),stroke:css("--line")}));
  });
  /* the dots of one slice and one ring are spread evenly across the slice's width, alternating in depth, so none hides another */
  const keyOf = it => (layersOf(it)[0] || "foundation") + "|" + it.relevance;
  const groups = {}; for (const it of items) (groups[keyOf(it)] = groups[keyOf(it)] || []).push(it);
  /* each dot stays inside its slice and its ring band (high near the centre, low at the rim); touching dots are pushed
     apart a few times within those bounds */
  const BAND = {high:[30, 96], medium:[100, 144], low:[148, 180]};
  const dots = items.map(it => {
    const lid = layersOf(it)[0] || "foundation", li = layers.findIndex(l => l.id === lid);
    const grp = groups[keyOf(it)], k = grp.indexOf(it), m = grp.length, [lo, hi] = BAND[it.relevance] || BAND.medium;
    const margin = 6, a0 = li * step + margin, a1 = (li + 1) * step - margin;
    return { it, a0, a1, lo, hi, size: {info:7,advice:9,action:11,urgent:13}[it.level],
             ang: a0 + (a1 - a0) * (k + 1) / (m + 1), r: lo + (hi - lo) * (m > 1 ? (k % 3 + 1) / 4 : .5) };
  });
  const xy = d => [C + d.r * Math.sin(d.ang * Math.PI / 180), C - d.r * Math.cos(d.ang * Math.PI / 180)];
  for (let pass = 0; pass < 60; pass++){
    let moved = false;
    for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++){
      const a = dots[i], b = dots[j], [ax, ay] = xy(a), [bx, by] = xy(b);
      const need = a.size + b.size + 10, dist = Math.hypot(ax - bx, ay - by) || .01;
      if (dist >= need) continue;
      moved = true;
      const push = (need - dist) / 2, ux = (ax - bx) / dist, uy = (ay - by) / dist;
      for (const [d, s] of [[a, 1], [b, -1]]){
        const [x, y] = xy(d), nx = x + s * ux * push - C, ny = C - (y + s * uy * push);
        d.r = Math.min(d.hi, Math.max(d.lo, Math.hypot(nx, ny)));
        let ang = Math.atan2(nx, ny) * 180 / Math.PI; if (ang < 0) ang += 360;
        d.ang = Math.min(d.a1, Math.max(d.a0, ang));
      }
    }
    if (!moved) break;
  }
  /* an info bar under the radar, on the author's ruling (2026-11-09): at rest it asks the reader to hover a signal;
     on a hovered or focused dot it shows the signal's level and title. It is information only, with nothing to click,
     and it keeps one height so the radar never moves. */
  const stage = el("div","radarstage");
  const info = el("div","infobar"); info.id = "radarInfo"; info.setAttribute("aria-live","polite");
  /* A phone has no hover (author, 2026-11-09: "did you think how this hover feature would work on a mobile phone?!").
     With a finger, the first tap on a dot SELECTS it: the bar shows its level and title and stays, with the one way on,
     "Open this signal"; a second tap on the same dot, or that link, opens it. With a mouse, hover shows and a click
     opens, as before. The choice is made per touch (pointerType), so a laptop with a touch screen gets both. */
  const touchUI = matchMedia("(hover: none)").matches;
  let picked = null, lastType = touchUI ? "touch" : "mouse";
  const hide = () => { info.classList.remove("on"); info.replaceChildren(el("span","ihint", touchUI ? "Tap a signal on the radar to see a short description here." : "Hover a signal on the radar to see a short description here.")); };
  const show = (it, withWay) => {
    info.classList.add("on"); info.replaceChildren(levelPill(it.level), el("span","ititle",clean(it.title)));
    if (withWay){ const a = el("a","iopen","Open this signal →"); a.href = "#/signal/" + it.id; info.append(a); }   /* it stays, so it can be reached */
  };
  const blips = [];
  hide();
  for (const d of dots){
    const it = d.it, [x, y] = xy(d), size = d.size;
    const g = mk("a",{class:"blip",tabindex:"0",href:"#/signal/" + it.id,"aria-describedby":"radarInfo","aria-label":WORD[it.level] + ": " + clean(it.title) + ". Opens its page in All signals."});
    g.append(mk("circle",{class:"hit",cx:x,cy:y,r:size+11,fill:"transparent"}));   /* a target a finger can hit */
    g.append(mk("circle",{class:"halo",cx:x,cy:y,r:size+4,fill:"none",stroke:css("--lv-"+it.level),"stroke-width":"2"}));
    g.append(mk("circle",{cx:x,cy:y,r:size,fill:css("--lv-"+it.level)}));
    g.addEventListener("pointerdown", e => { lastType = e.pointerType || lastType; });
    g.addEventListener("click", e => {
      if (lastType !== "touch" || picked === it) return;            /* a mouse click, or the second tap: open */
      e.preventDefault(); picked = it;
      blips.forEach(b => b.classList.toggle("picked", b === g)); show(it, true);
    });
    g.addEventListener("mouseenter", () => { if (lastType !== "touch") show(it, false); });
    g.addEventListener("mouseleave", () => { if (lastType !== "touch") picked ? show(picked, true) : hide(); });
    g.addEventListener("focusin", () => show(it, picked === it));
    g.addEventListener("focusout", () => { if (!picked) hide(); });
    blips.push(g); svg.append(g);
  }
  /* each slice's number stands just outside the rim and its name runs outward from it (author, 2026-11-09). They are HTML, so they
     keep the page's reading size at any radar size; place() sizes the radar to leave them room. Where the card is too
     narrow for names beside a radar worth reading (a phone), the names go in a short list under it instead. */
  const labs = layers.map((l, i) => {
    const m = ((i + .5) * step) * Math.PI / 180, s = el("div", "sl" + (Math.sin(m) < 0 ? " left" : "") + (Math.cos(m) > 0 ? " up" : " down") + (Math.abs(Math.sin(m)) > .7 ? " side" : ""));
    s.append(el("b",null,String(i + 1)), el("span",null,l.name)); s.hidden = true; stage.append(s);   /* shown once place() has put it */
    return { s, m, b: s.firstChild, pole: Math.abs(Math.cos(m)) > .7 };   /* pole: above or below the circle */
  });

    const W = stage.clientWidth, H0 = stage.clientHeight; let H = H0; if (!W || !H) return;

    labs.forEach(o => { o.s.hidden = false; o.s.classList.remove("numonly"); });   /* measure every label at its full size */
    /* the largest rim at which every label, at its own width and height, stays inside the stage. The labels above and
       below the circle sit clear of its top and bottom (the author's drawing, 2026-11-09) and keep their name on one
       line while the radar stays a readable size; only a narrow card lets them wrap. */
    const gap = 18, clear = 8;                                      /* the number's centre this far outside the rim keeps its box off the circle */
    const fit = () => { let r = Math.min(W, H) / 2;
      for (const o of labs){
        const w = o.s.offsetWidth - o.b.offsetWidth / 2 + 4, h = o.s.offsetHeight + 4, sx = Math.abs(Math.sin(o.m)), cy = Math.abs(Math.cos(o.m));
        r = Math.min(r, (W / 2 - w) / Math.max(sx, .01) - gap);
        r = Math.min(r, o.pole ? H / 2 - h - clear : (H / 2 - (h - o.b.offsetHeight / 2)) / cy - gap);
      }
      return r; };
    labs.forEach(o => o.s.classList.toggle("one", o.pole));
    let rim = fit();
    if (rim < 110){ labs.forEach(o => o.s.classList.remove("one")); rim = fit(); }
    const beside = rim >= 80;
    order.hidden = beside;
    labs.forEach(o => { o.s.hidden = false; o.s.classList.toggle("numonly", !beside); });   /* too narrow for names: the numbers stay, the names go in the list */
    if (!beside) rim = Math.min(W, H0) / 2 * 186 / 220;
    const D = rim * 2 * 220 / 186, cx = W / 2, cy = H / 2;
    Object.assign(svg.style, { inset:"auto", position:"absolute", width: D + "px", height: D + "px", left: (cx - D / 2) + "px", top: (cy - D / 2) + "px" });
    if (!beside) for (const o of labs){
      const g = rim * 34 / 186 / 2, x = cx + (rim + g) * Math.sin(o.m), y = cy - (rim + g) * Math.cos(o.m);
      Object.assign(o.s.style, { left: x + "px", top: y + "px", right: "auto", transform: "translate(-50%,-50%)" });
    }
    if (beside) for (const o of labs){
      const sx = Math.sin(o.m), cyy = Math.cos(o.m), x = cx + (rim + gap) * sx, half = o.b.offsetWidth / 2;
      /* above the circle a label's foot rests just over its top; below, its head just under its bottom; beside it, the
         number stands on the rim's line out from the slice */
      const pos = o.pole ? (cyy > 0 ? { top: (cy - rim - clear) + "px", transform: "translateY(-100%)" } : { top: (cy + rim + clear) + "px", transform: "none" })
                         : { top: (cy - (rim + gap) * cyy) + "px", transform: cyy > 0 ? "translateY(calc(-100% + " + (o.b.offsetHeight / 2) + "px))" : "translateY(-" + (o.b.offsetHeight / 2) + "px)" };
      Object.assign(o.s.style, sx >= 0 ? { left: (x - half) + "px", right: "auto" } : { right: (W - x - half) + "px", left: "auto" }, pos);
    }
  };
  new ResizeObserver(place).observe(stage);
  setTimeout(place, 0); setTimeout(place, 120); document.fonts?.ready.then(place);   /* no frame runs in a background tab */
  window.placeRadar = place;                                                          /* the window's resize hook calls the current one */
  stage.append(svg);
  const box = el("div");
  box.append(el("p","radarhint",(touchUI ? "Tap a signal to read it below; tap it again to open its page." : "Click a signal to open its page.") + (total > items.length ? " Showing the " + items.length + " that ask most, of " + total + "." : "")), stage);
  const key = el("div","key");
  for (const lv of ["urgent","action","advice","info"]){ const s = el("span"); const d = el("i"); d.style.background = css("--lv-"+lv); s.append(d, document.createTextNode(WORD[lv])); key.append(s); }
  key.append(el("span",null,"centre: most relevant"));
  box.append(info, key, order); return box;
}

/* ------------------------------------------------------------ view: trends

   how it reacted, and what it learned. Charts are HTML (their text keeps the reading size), each with its table.
   A chart over time appears from two weeks on; one week is shown as ranked bars, never as a one-bar chart. */
let STANCE = {};                                  /* filled from lookout.yaml, agent.stances */

const days = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5);
const median = xs => { if (!xs.length) return 0; const s = [...xs].sort((a,b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m-1] + s[m]) / 2); };
const dayWords = n => n === 0 ? "same day" : plural(n, "day");
function figure(title, lead, chart, head, rows){
  const f = el("figure","fig"); f.append(el("h3",null,title)); if (lead) f.append(el("p","figlead",lead)); f.append(chart);
  const d = el("details","tv"); d.append(el("summary",null,"Show as a table"));
  const t = el("table","tbl"), tr = el("tr"); for (const h of head) tr.append(el("th",null,h)); const th = el("thead"); th.append(tr); t.append(th);
  const tb = el("tbody"); for (const r of rows){ const x = el("tr"); r.forEach((c, i) => x.append(el(i ? "td" : "th", null, String(c)))); tb.append(x); } t.append(tb);
  d.append(t); f.append(d); return f;
}
/* ranked horizontal bars: one series, one colour, value written at the end of each bar */
function hbars(rows, opt = {}){
  const max = Math.max(1, ...rows.map(r => r.value)), box = el("div","hbars");
  for (const r of rows){
    const row = el(r.href ? "a" : "div","hrow"); if (r.href) row.href = r.href;
    const lab = el("span","hlab"); lab.append(el("b",null,r.label)); if (r.sub) lab.append(el("span","hsub"," " + r.sub));
    const track = el("span","htrack"), bar = el("span","hbar"); bar.style.width = (r.value / max * 100) + "%";
    if (r.color) bar.style.background = r.color; bar.title = r.label + ": " + r.value + (opt.unit ? " " + opt.unit : "");
    track.append(bar); row.append(lab, track, el("span","hval",r.text ?? String(r.value))); if (r.text) row.classList.add("wideval"); box.append(row);
  }
  return box;
}
/* columns by week, stacked by an ordered key; legend above, total on top of each column */
function columns(weeks, keys, colorOf, labelOf, countOf){

function viewTrends(q){

    ["Over the weeks the radar has kept: how much was read and how carefully, where " + NAME() + " stands on each development, what it proposed to its own projects, and what it wrote down to learn from. Every number opens the signals behind it."]));

  sl.value = span; sl.addEventListener("change", () => { location.hash = "#/trends" + (sl.value === "all" ? "" : "?n=" + sl.value); });

    (byLv[0]?.n ? "Most ask " + NAME() + " " + WORD[byLv[0].k].toLowerCase() + " (" + byLv[0].n + " of " + n + "). " : "") +

  keyfigs([[n, "signals read"], [pct(read), "read at the source"], [srcs, "sources"], [(n / Math.max(1,weeks.length)).toFixed(1).replace(".0",""), "signals a week"]]);

    ["Week", ...lv.map(k => WORD[k]), "total"], weeks.map(w => [w, ...lv.map(k => cnt(w,k)), lv.reduce((s,k) => s + cnt(w,k), 0)])));

  /* ---- 2. where Softanza stands */
  const st = Object.keys(STANCE).map(k => ({k, n: items.filter(i => i.stance === k).length})).filter(x => x.n).sort((a,b) => b.n - a.n);
  const lcount = (lid, w) => items.filter(i => (w ? weekOf(i.date) === w : 1) && layersOf(i).includes(lid)).length;

  const ast = ASTATE.map(k => ({k, n: acts.filter(a => a.state === k).length}));

const DOCS = { why: {file:"docs/WHY.md", eyebrow:""}, method: {file:"docs/METHOD.md", eyebrow:""} };
function viewDoc(name){

  holder.append(head(d.eyebrow, " ", []));

    .then(md => { holder.replaceChildren(...renderDoc(md, d.eyebrow)); evenSoon(holder); })
    .catch(() => holder.replaceChildren(head(d.eyebrow, "This page could not be loaded", ["Reload the page to try again."])));
