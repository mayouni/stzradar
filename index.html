<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Softanza AI Radar</title>
<meta name="description" content="Softanza AI Radar: what changed in AI this week, and what it means for what we build in Softanza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Softanza AI Radar, built with Lookout. The reading laws of the estate's sites, applied:
   - one reading size (19 px) and nothing below 16 px; secondary text is a readable tone, never small-and-grey;
   - one scroll bar on screen (Zane Rules 14 and 92), nothing scrolls sideways at 375 px;
   - no motion while navigating; a bar never covers content; no tabs that hide content (Rule 12).
   The palette is the Compass palette the estate's sites share (teal accent, serif titles). */
:root{
  --bg:#F6F8F8; --panel:#FFFFFF; --tint:#EAF4F4; --ink:#10262A; --ink2:#34474B; --line:#CFDCDD;
  --accent:#1B6B72; --accent-ink:#FFFFFF; --deep:#0E4E54;
  --lv-info:#6250D6; --lv-advice:#2A9D8F; --lv-action:#D97706; --lv-urgent:#B42318;
  /* level colours: checked with the dataviz palette checker, every pair, on the white card (worst colour-blind dE 13.2) */
  --lv-info-on:#FFFFFF; --lv-advice-on:#10262A; --lv-action-on:#10262A; --lv-urgent-on:#FFFFFF;
  --f-title:"Source Serif 4", Georgia, serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --read:1.3125rem;  /* 21 px: the author found 19 small (2026-11-09) */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1617; --panel:#122022; --tint:#16292C; --ink:#E3F1F2; --ink2:#B9CFD2; --line:#28403F;
  --accent:#8FD3D8; --accent-ink:#0C1617; --deep:#5FB6BC;
  --lv-info:#8478E0; --lv-advice:#1E9C89; --lv-action:#C98500; --lv-urgent:#E04848;
  --lv-info-on:#0C1617; --lv-advice-on:#0C1617; --lv-action-on:#0C1617; --lv-urgent-on:#0C1617; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1617; --panel:#122022; --tint:#16292C; --ink:#E3F1F2; --ink2:#B9CFD2; --line:#28403F;
  --accent:#8FD3D8; --accent-ink:#0C1617; --deep:#5FB6BC;
  --lv-info:#8478E0; --lv-advice:#1E9C89; --lv-action:#C98500; --lv-urgent:#E04848;
  --lv-info-on:#0C1617; --lv-advice-on:#0C1617; --lv-action-on:#0C1617; --lv-urgent-on:#0C1617; color-scheme:dark }

*{box-sizing:border-box}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font:400 var(--read)/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
html.locked,html.locked body{overflow:hidden}

/* the pinned head: level 1 = the views, level 2 = who is reading */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.row1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand nav help";align-items:center;gap:8px 28px;padding-block:12px 8px}
.row1 .brand{grid-area:brand}.row1 nav{grid-area:nav}.row1 .tools{grid-area:help;display:flex;align-items:center;gap:14px}
/* the GitHub mark, top right: an icon button, the one place a tooltip belongs */
.gh{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--ink)}
.gh:hover{color:var(--accent);background:var(--tint)}
@media (max-width:820px){.row1{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand help" "nav nav"}}
#helpOpen .short{display:none}
/* the readers' name is longer than the tool's: on a phone the brand steps down and the help button says Help, so the two never meet */
@media (max-width:520px){.brand{font-size:1.25rem}#helpOpen .long{display:none}#helpOpen .short{display:inline}}
@media (max-width:900px){.row2 .why{display:none}}
.brand{font:700 1.5rem/1 var(--f-title);color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.brand .bn{color:var(--ink)}
nav.views{display:flex;flex-wrap:wrap;gap:4px 20px}
nav.views a{font-weight:600;color:var(--ink);text-decoration:none;padding:4px 0;border-bottom:3px solid transparent;font-size:1.1875rem}
nav.views a[aria-current="page"]{border-bottom-color:var(--accent);color:var(--deep)}
:root[data-theme="dark"] nav.views a[aria-current="page"]{color:var(--accent)}
.help{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:1.125rem}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:6px 12px;font-size:1.125rem}
.row2 .lab{font-weight:600;color:var(--ink2)}
.seg{display:inline-flex;flex-wrap:nowrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 14px;cursor:pointer;font-size:1.125rem;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row2 .why{color:var(--ink2)}
#readerSel{display:none}
/* on a phone the pinned header and the help keep their compact size, so the reading text has the screen */
@media (max-width:520px){nav.views a,.help,.row2,.row2 .lab,#readerSel,.seg a,.seg button{font-size:1rem}
  nav.views{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:2px 18px}   /* five entries as 3 + 2, never one alone */
  .helpbox dl{font-size:1rem}.helpbox dd{font-size:1rem}
  #aboutLab{display:none}.seg a{padding:5px 11px}}
@media (max-width:520px){#readers{display:none}#readerSel{display:inline-block}.row2{flex-wrap:nowrap}
  .facts{display:grid;grid-template-columns:1fr 1fr}.fact{min-width:0}}

/* page heads */
.head{background:var(--tint);border-bottom:1px solid var(--line)}
.head .wrap{padding-block:28px 26px}
.eyebrow{font:600 1.125rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--deep);margin:0 0 8px}
:root[data-theme="dark"] .eyebrow{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .eyebrow{color:var(--accent)} }
h1{font:700 clamp(1.75rem,3.2vw,2.5rem)/1.15 var(--f-title);margin:0 0 12px;max-width:30ch;text-wrap:balance}
/* lines in equilibrium (Zane amendment docket F-1, the author's recurring remark): a title balances its lines, and no
   paragraph, list item or label leaves one short word alone on its last line */
h1,h2,h3,h4,.card h3,.ititle,.fnode b,
p,li,dd,dt,figcaption,summary,.lede,.finding,.notice,.kindline,.ihint,.fnode span,.hint,.q{text-wrap:balance}
.lede{max-width:88ch;margin:0;color:var(--ink);font-size:1.375rem;line-height:1.5}
.lede+.lede{margin-top:10px}
h2{font:700 1.5rem/1.2 var(--f-title);margin:0 0 12px}
h3{font:700 1.25rem/1.25 var(--f-title);margin:0}
section.block{padding-block:28px 8px}
/* Zane Rule 8 across the site: one primary axis, read top to bottom; figures in one aligned row, no boxes */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:12px;margin-top:18px;padding:12px 0;border-block:1px solid var(--line);max-width:64rem}
.fact{min-width:0}
.fact b{display:block;font:700 1.75rem/1.1 var(--f-title);color:var(--deep)}
:root[data-theme="dark"] .fact b{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fact b{color:var(--accent)} }

/* this week */
/* the radar page, on the author's ruling (2026-11-09): the radar holds the left half, enlarged and fixed in view,
   the list fills the right half and is what moves. The page keeps ONE scroll bar: the radar is sticky, so the page's
   own scroll moves only the list. On a narrow screen the radar sits above the list. */
.week{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.week .scope{position:sticky;top:calc(var(--head,150px) + 16px);display:flex;flex-direction:column;height:calc(100vh - var(--head,150px) - 32px)}
/* inside the pinned card, the radar takes the height that is left once the line above, the info bar, the legend and
   the slice names have theirs, so everything stays inside the card at any window height */
.week .scope > div{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.week .radarstage{flex:1 1 0;min-height:9rem;position:relative}
.week .scope svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.week .scope{position:static;height:auto}.week .radarstage{flex:none;aspect-ratio:1/1;min-height:0}}
/* a window too short to hold the whole card pinned: the card stays at full size and scrolls with the page */
@media (max-height:759px){.week .scope{position:static;height:auto}.week .radarstage{flex:none;aspect-ratio:1/1;min-height:0}}
.scope{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(16,38,42,.06)}
.scope svg{width:100%;height:auto;display:block}
.scope .lbl{font:700 22px var(--f-body);fill:var(--ink2)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 2px 0;font-size:1.125rem;color:var(--ink2)}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.blip{cursor:pointer}
.blip:focus-visible circle.halo,.blip:hover circle.halo{stroke-width:4}
.blip:focus{outline:none}
/* the info bar under the radar: one height, information only; the level stands out as its tinted label */
.infobar{min-height:4.4rem;margin-top:8px;padding:8px 12px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 10px 10px 0;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.infobar.on{border-left-color:var(--accent)}
.infobar .ihint{color:var(--ink2);font-size:1.1875rem}
.infobar .ititle{font:700 1.0625rem/1.35 var(--f-title);flex:1 1 14rem;min-width:0}
.radarhint{margin:0 0 6px;font-size:1.1875rem;line-height:1.4;color:var(--ink2)}
/* the slice names around the rim: number in ink, name as the slice's one link */
.radarstage .sl{position:absolute;max-width:6.4em;font-size:1.125rem;line-height:1.3;color:var(--ink2);text-wrap:balance}
.radarstage .sl b{color:var(--ink)}
.radarstage .sl a{color:var(--deep);text-decoration:underline}
.radarstage svg{display:block}
/* on a phone the names go in a numbered list under the radar */
.scope .slices{margin:10px 0 0;padding-left:1.6em;font-size:1.125rem;line-height:1.5;columns:2;column-gap:24px}
.scope .slices a{color:var(--deep);text-decoration:underline}
.group{margin-bottom:22px}
.group>h3{font:700 1.125rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:6px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(16,38,42,.06)}
.card .stripe{background:var(--lv-info)}
.card .body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:1.125rem;color:var(--ink2)}
.pill{border:1px solid var(--line);border-radius:999px;padding:0 10px;white-space:nowrap;background:var(--panel)}
.pill.lv{background:color-mix(in srgb,var(--c) 13%,var(--panel));color:color-mix(in srgb,var(--c) 40%,var(--ink));border:1.5px solid var(--c);font-weight:700}   /* text at 7:1 or more, light and dark */
.kindline{color:var(--ink2);font-weight:600}
.new{color:var(--accent);font-weight:700}
.card h3{font-size:1.2rem}
.card p{margin:0}
.card p.plain{color:var(--ink2)}

/* the estate */
/* the stack is an architecture drawing, not prose: its layers stack as layers, their parts stand side by side, and the
   harness stands beside the stack (the author's ruling, 2026-11-09: the one-column rule is for text, not for this) */
.estate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,19rem);gap:20px;align-items:start}
@media (max-width:900px){.estate{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:10px}
.layer{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(16,38,42,.06)}
@media (max-width:700px){.layer{grid-template-columns:minmax(0,1fr)}}
.layer .name p{margin:4px 0 0;color:var(--ink2);font-size:1.125rem}
.projects{display:flex;flex-wrap:wrap;gap:10px}
.proj{flex:1 1 15rem;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:inherit;text-decoration:none;background:var(--bg)}
.proj b{font-family:var(--f-title);font-size:1.15rem}
.proj p{margin:4px 0 0;color:var(--ink2);font-size:1.125rem}
/* in-page links read as links: teal words, underlined, with their arrow; one emphasis, never bold as well. A filled teal pill is kept for one
   meaning only, the choice selected in the pinned bars, so nothing inside a page looks like one of them. */
.concern .n,.proj .n,.card .n{display:inline-block;align-self:flex-start;margin-top:8px;color:var(--deep);font-weight:400;font-size:1.125rem;text-decoration:underline}
:root[data-theme="dark"] .concern .n,:root[data-theme="dark"] .proj .n,:root[data-theme="dark"] .card .n{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .concern .n,:root:not([data-theme="light"]) .proj .n,:root:not([data-theme="light"]) .card .n{color:var(--accent)} }

.beside{background:var(--tint);border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.beside .proj{flex:none}
table.grid{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:1.125rem}
table.grid th,table.grid td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle}
table.grid thead th{background:var(--tint);font-weight:700}
table.grid tbody th{text-align:left;font-weight:700;white-space:normal}
table.grid td a{display:inline-block;min-width:2.2rem;padding:2px 8px;color:var(--deep);font-weight:400;font-size:1.1875rem;text-decoration:underline}
:root[data-theme="dark"] table.grid td a{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) table.grid td a{color:var(--accent)} }
.gridlist{display:none}
@media (max-width:820px){table.grid{display:none}.gridlist{display:flex;flex-direction:column;gap:12px}}
.gridlist .dom{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--accent);border-radius:999px;padding:2px 12px;text-decoration:none;font-weight:600;font-size:1.125rem;color:var(--deep);background:var(--panel)}
:root[data-theme="dark"] .chip{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip{color:var(--accent)} }
.concerns{display:flex;flex-direction:column;max-width:64rem}
.concern{display:block;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.concern:first-child{border-top:0}
.concern p{margin:4px 0 0;color:var(--ink2);font-size:1.125rem}

/* all signals */
/* the six filters share the row in equal parts, in rows that always come out full: 6, then 3 + 3, then 2 + 2 + 2;
   a control never sits alone on a line while the line above has room (reported to Zane: ZANE-CONTROLROW-01) */
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 18px;align-items:end;padding:0 0 16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
@media (max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:1.125rem;min-width:0}
.filters select{width:100%}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:1.125rem;max-width:100%}
.count{font-weight:700;margin:0 0 12px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:20px}

/* one signal: a page, every part in view, ordered for the reader */
.sig{max-width:820px}
.sig .part{padding-block:18px 6px;border-top:1px solid var(--line)}
.sig .part:first-of-type{border-top:0}
.sig h2{font-size:1.35rem}
.sig p{margin:0 0 10px;max-width:80ch}
.notice{border-left:4px solid var(--accent);padding:6px 0 6px 16px;font-size:1.25rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.kv dt{color:var(--ink2);font-weight:600}
.kv dd{margin:0}
ul.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.code{position:relative;background:var(--tint);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.code .why{padding:10px 16px 0;color:var(--ink2);font-size:1.125rem}
.code pre{margin:0;padding:12px 16px 14px;font:400 1.125rem/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.copy{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:1.125rem;cursor:pointer}
.code.withcopy pre{padding-right:5.5rem}
details{border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:10px;background:var(--panel)}
details summary{cursor:pointer;font-weight:600}
details p{margin-top:8px}
.terms{display:flex;flex-direction:column;gap:8px}
.term b{font-family:var(--f-mono);font-size:1.125rem}
.back{display:inline-block;margin-bottom:10px;font-weight:600}

/* weeks */
nav.weeks{display:flex;flex-wrap:wrap;align-items:end;gap:10px 18px;margin-top:18px}
nav.weeks .step{font-weight:700}
nav.weeks .goto{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:1.125rem}

/* trends: figures in two columns on a wide screen, one on a phone */
/* trends reads as one column: chapters, each opening on its finding, the figures under it at one width */
.report{max-width:64rem}
.report .period{margin:0 0 6px;font-size:1.1875rem}
.report .period select{margin:0 4px}
h2.chap{font:700 1.6rem/1.2 var(--f-title);margin:40px 0 10px;padding-top:22px;border-top:2px solid var(--line)}
h2.chap:first-of-type{margin-top:18px}
p.finding{font-size:1.3125rem;line-height:1.55;margin:0 0 18px;max-width:80ch}
.keyfigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 8px;padding:12px 0;border-block:1px solid var(--line)}
.keyfigs div{display:flex;flex-direction:column}
.keyfigs b{font:700 1.75rem/1.15 var(--f-title);color:var(--deep)}
:root[data-theme="dark"] .keyfigs b{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .keyfigs b{color:var(--accent)} }
.keyfigs span{color:var(--ink2);font-size:1.1875rem}
@media (max-width:640px){.keyfigs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{margin:26px 0 0;padding:0;min-width:0}
.fig h3{margin-bottom:4px;font-size:1.2rem}
.figlead{margin:0 0 12px;color:var(--ink2);font-size:1.1875rem}
.fsub{display:block;color:var(--ink2);font-size:1.125rem}
.hbars{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 2.5rem;gap:4px 12px;align-items:center;color:inherit;text-decoration:none;font-size:1.1875rem}
.hlab b{font-weight:700}
.hsub{color:var(--ink2)}
.htrack{height:14px;background:transparent;border-bottom:1px solid var(--line);display:flex;align-items:center}
.hbar{display:block;height:12px;min-width:4px;background:var(--accent);border-radius:0 4px 4px 0}
.hval{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow.wideval{grid-template-columns:minmax(0,15rem) minmax(0,1fr) 6.5rem}
@media (max-width:640px){.hrow.wideval{grid-template-columns:minmax(0,1fr) auto}.hrow{grid-template-columns:minmax(0,1fr) 2.5rem;grid-template-areas:"l v" "t t"}.hlab{grid-area:l}.hval{grid-area:v}.htrack{grid-area:t}}
.cols .plot{display:flex;align-items:flex-end;gap:10px;height:220px;border-bottom:1px solid var(--line);padding-top:24px;margin-top:10px}
.col{flex:1 1 0;max-width:72px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-decoration:none;color:inherit;position:relative}

.ctot{text-align:center;font-weight:700;font-size:1.125rem}

/* make your own */

/* an action inside a page is outlined; only the bars' selected choice is filled */

<script src="bar/lookout-bar.js" data-no-bar></script>
<script>
"use strict";
let FEED = null, MAP = null, LESSONS = {}, CONFIG = null, DIGESTS = [];
/* the project this watch serves, from app/config.json (lookout.yaml) */
const NAME = () => CONFIG.project.name, WATCH = () => CONFIG.watch.name, TOPIC = () => CONFIG.watch.topic;
const RADAR = () => CONFIG.watch.title || (NAME() + " " + TOPIC() + " Radar");   /* what readers see; WATCH() is the tool */
const poss = s => s + (/s$/.test(s) ? "'" : "'s");
let live = [];
const LEVELS = ["info","advice","action","urgent"];
/* the level labels, capitalized wherever they stand as labels; inside a sentence they are lowercased */
const WORD = {info:"To know", advice:"To consider", action:"To do", urgent:"To do now"};
const GROUP = {urgent:"To do now", action:"To do", advice:"To consider", info:"To know"};

/* one reader, chosen once; it decides what a card says and in which order a signal's page reads */
const READERS = {
  developer: {label:"Developer",  why:"checks and code to run in your own project come first",
              order:["notice","build","happened","learn","estate","actions","sources"]},
  maintainer:{label:"Maintainer", why:"what happened and the work proposed to the project's parts come first",
              order:["notice","happened","actions","estate","build","learn","sources"]},
  learner:   {label:"Learner",    why:"each signal opens on a lesson in plain words",
              order:["notice","learn","happened","estate","build","sources"]},
  user:      {label:"User",       why:"what happened, and what it means for the software you use",
              order:["notice","happened","learn","estate","sources"]}
};

const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const clean = s => String(s ?? "").replace(/[\u0000-\u001f\u007f]/g, " ");      /* plain text only */
const today = new Date().toISOString().slice(0,10);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
let reader = store.get("reader", store.get("role", "developer"));
if (!READERS[reader]) reader = "developer";
const seen = new Set(store.get("seen", []));

/* ------------------------------------------------------------ the map */
let ALIAS = {}, PROJ = {}, LAYER = {}, DOMAIN = {}, CONCERN = {};
function indexMap(){
  for (const l of MAP.layers) LAYER[l.id] = l;
  for (const p of MAP.projects){ PROJ[p.id] = p; ALIAS[p.id] = p.id; for (const a of (p.aliases||[])) ALIAS[a] = p.id; }
  for (const d of MAP.domains) DOMAIN[d.id] = d;
  for (const c of MAP.concerns) CONCERN[c.id] = c;
}
const projOf = a => ALIAS[a] || ALIAS[a.split(".")[0]] || null;
const projectsOf = it => [...new Set((it.areas||[]).map(projOf).filter(Boolean))];
const layersOf = it => [...new Set(projectsOf(it).map(p => PROJ[p].layer))];
/* a level reads as dark text in its own hue on a pale tint of it, with a border in the full colour: no text on a mid-tone fill */
const levelPill = lv => { const p = el("span","pill lv",WORD[lv]); p.style.setProperty("--c", "var(--lv-" + lv + ")"); return p; };
function weekOf(dateStr){
  const d = new Date(dateStr + "T00:00:00Z"); const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return d.getUTCFullYear() + "-W" + String(Math.ceil(((d - y0) / 864e5 + 1) / 7)).padStart(2,"0");
}
/* what a signal asks first, then how much it touches the project, then the newest: the order of the list and of the radar's choice */
const REL = {high:2, medium:1, low:0};
const byLevel = (a,b) => LEVELS.indexOf(b.level) - LEVELS.indexOf(a.level) || (REL[b.relevance] ?? 1) - (REL[a.relevance] ?? 1) || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
const radarLimit = () => Math.min(12, Math.max(3, Number(CONFIG?.watch?.radar_limit) || 7));

/* ------------------------------------------------------------ a card */
function card(it){
  /* one thing to click, in one place: the link at the card's foot; the card itself is not a link and does not react to
     the pointer (the author's ruling, 2026-11-09; reported to Zane as ZANE-ONELINK-01) */
  const c = el("div","card");
  const stripe = el("span","stripe"); stripe.style.background = css("--lv-"+it.level);
  const b = el("div","body"), m = el("span","meta");
  /* labels, not controls: the line reads "security · touches Softanza and Haro" */
  m.append(levelPill(it.level));
  const names = projectsOf(it).map(p => PROJ[p].name);
  const touch = names.length ? " · touches " + (names.length > 1 ? names.slice(0,-1).join(", ") + " and " + names.at(-1) : names[0]) : "";
  m.append(el("span","kindline", it.kind + touch));
  if (!seen.has(it.id)) m.append(el("span","new","new"));
  b.append(m, el("h3",null,clean(it.title)));
  const note = it.notice?.[reader];
  if (note) b.append(el("p",null,clean(note)));
  else b.append(el("p","plain",clean((LESSONS[it.id]?.lesson || it.summary).split(". ")[0].replace(/\.$/,"") + ".")));
  const go = el("a","n","Open this signal →"); go.href = "#/signal/" + it.id; b.append(go);
  c.append(stripe, b); return c;
}
/* A page head: an optional line of information above the title (the week and its dates), never a path: the two
   pinned bars already mark every level of this site, so a path would say them again (Zane Rule 108) */
function head(eyebrow, title, ledes){
  const h = el("div","head"), w = el("div","wrap");
  if (eyebrow) w.append(el("p","eyebrow",eyebrow));
  w.append(el("h1",null,title));
  for (const l of ledes) w.append(typeof l === "string" ? el("p","lede",l) : l);
  h.append(w); return h;
}

/* ------------------------------------------------------------ view: this week */
/* every week that holds an entry, newest first; a past week keeps its entries even after their review date */
const weeksAll = () => [...new Set(FEED.items.map(i => weekOf(i.date)))].sort().reverse();
function weekSpan(wk){
  const [y, w] = wk.split("-W").map(Number);
  const jan4 = new Date(Date.UTC(y,0,4)), mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (w - 1) * 7);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  const f = (d, o) => d.toLocaleDateString("en-GB", Object.assign({timeZone:"UTC"}, o));
  return mon.getUTCMonth() === sun.getUTCMonth() ? f(mon,{day:"numeric"}) + " to " + f(sun,{day:"numeric",month:"long",year:"numeric"})
                                                 : f(mon,{day:"numeric",month:"long"}) + " to " + f(sun,{day:"numeric",month:"long",year:"numeric"});
}
function viewWeek(wkArg){
  const weeks = weeksAll();
  /* with no week asked for, the newest week a survey has closed (it has a digest); a newer week stays one step ahead */
  const surveyed = weeks.find(w => DIGESTS.includes(w)) || weeks[0];
  const wk = weeks.includes(wkArg) ? wkArg : surveyed;
  const latest = wk === surveyed;
  const items = FEED.items.filter(i => weekOf(i.date) === wk && i.status !== "superseded").sort(byLevel);
  const frag = document.createDocumentFragment();
  const h = head("Week " + wk + " · " + weekSpan(wk),
    wk >= surveyed ? CONFIG.watch.tagline : (CONFIG.watch.tagline_past || "What changed in {topic} in week {week}").replace("{topic}", TOPIC()).replace("{week}", wk),
    [CONFIG.watch.intro]);
  /* the week stepper: the weeks that hold signals, one step at a time, or any of them from the list */
  const nav = el("nav","weeks"); nav.setAttribute("aria-label","Weeks");
  const i = weeks.indexOf(wk);
  if (i < weeks.length - 1){ const a = el("a","step","← Week " + weeks[i + 1]); a.href = "#/week/" + weeks[i + 1]; nav.append(a); }
  if (i > 0){ const a = el("a","step","Week " + weeks[i - 1] + " →"); a.href = "#/week/" + weeks[i - 1]; nav.append(a); }
  const lab = el("label","goto"); lab.append(document.createTextNode("Go to week"));

function radar(items, total = items.length){
  const NS = "http://www.w3.org/2000/svg", mk = (t, a) => { const e = document.createElementNS(NS,t); for (const k in a) e.setAttribute(k,a[k]); return e; };
  const svg = mk("svg",{viewBox:"0 0 440 440",role:"img","aria-label":"Radar: each slice is a layer of " + NAME() + "; the closer to the centre, the more relevant"});
  const C = 220, R = {high:72, medium:122, low:168}, layers = MAP.layers, n = layers.length, step = 360 / n;
  svg.append(mk("circle",{cx:C,cy:C,r:186,fill:css("--tint"),stroke:css("--line")}));
  for (const r of Object.values(R)) svg.append(mk("circle",{cx:C,cy:C,r,fill:"none",stroke:css("--line"),"stroke-dasharray":"4 6"}));
  layers.forEach((l, i) => {
    const a = (i * step) * Math.PI / 180;
    svg.append(mk("line",{x1:C,y1:C,x2:C + 186*Math.sin(a),y2:C - 186*Math.cos(a),stroke:css("--line")}));
  });
  /* the dots of one slice and one ring are spread evenly across the slice's width, alternating in depth, so none hides another */
  const keyOf = it => (layersOf(it)[0] || "foundation") + "|" + it.relevance;
  const groups = {}; for (const it of items) (groups[keyOf(it)] = groups[keyOf(it)] || []).push(it);
  /* each dot stays inside its slice and its ring band (high near the centre, low at the rim); touching dots are pushed
     apart a few times within those bounds */
  const BAND = {high:[30, 96], medium:[100, 144], low:[148, 180]};
  const dots = items.map(it => {
    const lid = layersOf(it)[0] || "foundation", li = layers.findIndex(l => l.id === lid);
    const grp = groups[keyOf(it)], k = grp.indexOf(it), m = grp.length, [lo, hi] = BAND[it.relevance] || BAND.medium;
    const margin = 6, a0 = li * step + margin, a1 = (li + 1) * step - margin;
    return { it, a0, a1, lo, hi, size: {info:7,advice:9,action:11,urgent:13}[it.level],
             ang: a0 + (a1 - a0) * (k + 1) / (m + 1), r: lo + (hi - lo) * (m > 1 ? (k % 3 + 1) / 4 : .5) };
  });
  const xy = d => [C + d.r * Math.sin(d.ang * Math.PI / 180), C - d.r * Math.cos(d.ang * Math.PI / 180)];
  for (let pass = 0; pass < 60; pass++){
    let moved = false;
    for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++){
      const a = dots[i], b = dots[j], [ax, ay] = xy(a), [bx, by] = xy(b);
      const need = a.size + b.size + 10, dist = Math.hypot(ax - bx, ay - by) || .01;
      if (dist >= need) continue;
      moved = true;
      const push = (need - dist) / 2, ux = (ax - bx) / dist, uy = (ay - by) / dist;
      for (const [d, s] of [[a, 1], [b, -1]]){
        const [x, y] = xy(d), nx = x + s * ux * push - C, ny = C - (y + s * uy * push);
        d.r = Math.min(d.hi, Math.max(d.lo, Math.hypot(nx, ny)));
        let ang = Math.atan2(nx, ny) * 180 / Math.PI; if (ang < 0) ang += 360;
        d.ang = Math.min(d.a1, Math.max(d.a0, ang));
      }
    }
    if (!moved) break;
  }
  /* an info bar under the radar, on the author's ruling (2026-11-09): at rest it asks the reader to hover a signal;
     on a hovered or focused dot it shows the signal's level and title. It is information only, with nothing to click,
     and it keeps one height so the radar never moves. */
  const stage = el("div","radarstage");
  const info = el("div","infobar"); info.id = "radarInfo"; info.setAttribute("aria-live","polite");
  const hide = () => { info.classList.remove("on"); info.replaceChildren(el("span","ihint","Hover a signal on the radar to see a short description here.")); };
  const show = it => { info.classList.add("on"); info.replaceChildren(levelPill(it.level), el("span","ititle",clean(it.title))); };
  hide();
  for (const d of dots){
    const it = d.it, [x, y] = xy(d), size = d.size;
    const g = mk("a",{class:"blip",tabindex:"0",href:"#/signal/" + it.id,"aria-describedby":"radarInfo","aria-label":WORD[it.level] + ": " + clean(it.title) + ". Opens its page in All signals."});
    g.append(mk("circle",{class:"halo",cx:x,cy:y,r:size+4,fill:"none",stroke:css("--lv-"+it.level),"stroke-width":"2"}));
    g.append(mk("circle",{cx:x,cy:y,r:size,fill:css("--lv-"+it.level)}));
    g.addEventListener("mouseenter", () => show(it)); g.addEventListener("focusin", () => show(it));
    g.addEventListener("mouseleave", hide); g.addEventListener("focusout", hide);
    svg.append(g);
  }
  /* each slice's number and name stand outside the rim, beside the slice (author, 2026-11-09). They are HTML, so they
     keep the page's reading size at any radar size; place() sizes the radar to leave them room. Where the card is too
     narrow for names beside a radar worth reading (a phone), the names go in a short list under it instead. */
  const labs = layers.map((l, i) => {
    const s = el("span","sl"), a = el("a",null,l.name); a.href = "#/signals?l=" + l.id;
    s.append(el("b",null,String(i + 1)), document.createTextNode(" "), a); stage.append(s);
    const m = ((i + .5) * step) * Math.PI / 180;
    s.style.maxWidth = Math.abs(Math.cos(m)) > .7 ? "11em" : "6.4em";   /* above and below the rim a name runs wide and low; beside it, narrow */
    return { s, m };
  });
  const order = el("ol","slices"); layers.forEach(l => { const li = el("li"), a = el("a",null,l.name); a.href = "#/signals?l=" + l.id; li.append(a); order.append(li); });
  const place = () => {
    const W = stage.clientWidth, H0 = stage.clientHeight; let H = H0; if (!W || !H) return;
    if (!order.hidden && getComputedStyle(stage).flexGrow === "1") H += order.offsetHeight + 10;   /* judge with the list gone, as it will be */
    labs.forEach(o => o.s.hidden = false);
    /* the largest rim at which every label, at its own width and height, stays inside the stage */
    const gap = 10; let rim = Math.min(W, H) / 2;
    for (const o of labs){
      const w = o.s.offsetWidth + 4, h = o.s.offsetHeight + 4, sx = Math.abs(Math.sin(o.m)), cy = Math.abs(Math.cos(o.m));
      if (sx >= .15) rim = Math.min(rim, (W / 2 - w) / sx - gap);
      if (cy > .05) rim = Math.min(rim, (H / 2 - h * (.5 + .5 * cy)) / cy - gap);
    }
    const beside = rim >= 80;
    order.hidden = beside; labs.forEach(o => o.s.hidden = !beside);
    if (!beside) rim = Math.min(W, H0) / 2 * 186 / 220;
    const D = rim * 2 * 220 / 186, cx = W / 2, cy = H / 2;
    Object.assign(svg.style, { inset:"auto", position:"absolute", width: D + "px", height: D + "px", left: (cx - D / 2) + "px", top: (cy - D / 2) + "px" });
    if (beside) for (const o of labs){
      const sx = Math.sin(o.m), cyy = Math.cos(o.m), x = cx + (rim + gap) * sx, y = cy - (rim + gap) * cyy;
      const tx = Math.abs(sx) < .15 ? -50 : sx > 0 ? 0 : -100, ty = -50 - 50 * cyy;
      Object.assign(o.s.style, { left: x + "px", top: y + "px", transform: "translate(" + tx + "%," + ty + "%)", textAlign: tx === 0 ? "left" : tx === -100 ? "right" : "center" });
    }
  };
  new ResizeObserver(place).observe(stage);
  setTimeout(place, 0); setTimeout(place, 120); document.fonts?.ready.then(place);   /* no frame runs in a background tab */
  window.placeRadar = place;                                                          /* the window's resize hook calls the current one */
  stage.append(svg);
  const box = el("div");
  box.append(el("p","radarhint","Click a signal to open its page." + (total > items.length ? " Showing the " + items.length + " that ask most, of " + total + "." : "")), stage);
  const key = el("div","key");
  for (const lv of ["urgent","action","advice","info"]){ const s = el("span"); const d = el("i"); d.style.background = css("--lv-"+lv); s.append(d, document.createTextNode(WORD[lv])); key.append(s); }
  key.append(el("span",null,"centre: most relevant"));
  box.append(info, key, order); return box;
}

/* ranked horizontal bars: one series, one colour, value written at the end of each bar */

const DOCS = { why: {file:"docs/WHY.md", eyebrow:""}, method: {file:"docs/METHOD.md", eyebrow:""} };
function viewDoc(name){

  holder.append(head(d.eyebrow, " ", []));

function inlineMd(text, base){
  const out = document.createDocumentFragment();
  for (const part of String(text).split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)\s]+\))/g)){
    if (!part) continue;
    let m;
    if ((m = part.match(/^\*\*([^*]+)\*\*$/))) out.append(el("strong",null,m[1]));
    else if ((m = part.match(/^`([^`]+)`$/))) out.append(el("code",null,m[1]));
    else if ((m = part.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/))){
      const a = el("a",null,m[1]); const u = m[2];
      a.href = /^https?:/.test(u) ? u : new URL(u, base).href;           /* a link inside the repository opens on GitHub */
      a.target = "_blank"; a.rel = "noopener"; out.append(a);
    } else out.append(document.createTextNode(part));
  }
  return out;
}
function renderDoc(md, eyebrow){
  const base = CONFIG.watch.repository + "/blob/main/docs/";
  const lines = md.replace(/\r/g,"").split("\n");
  let title = "", i = 0;
  const body = el("section","block wrap doc"), nodes = [];
  let para = [], list = null, item = null;
  const flushPara = () => { if (para.length){ const p = el("p"); p.append(inlineMd(para.join(" "), base)); body.append(p); para = []; } };
  const flushList = () => { list = null; item = null; };
  while (i < lines.length){
    const L = lines[i];
    const fence = L.match(/^(`{3,})(\w*)\s*$/);
    if (fence){
      flushPara(); flushList();
      const close = fence[1], lang = fence[2], buf = [];
      i++;
      while (i < lines.length && lines[i].trim() !== close) buf.push(lines[i++]);
      i++;
      if (lang === "mermaid") body.append(flowDiagram(buf.join("\n")));
      else { const w = el("div","code"), pre = el("pre"); pre.textContent = buf.join("\n"); w.append(pre); body.append(w); }
      continue;
    }
    let m;
    if ((m = L.match(/^# (.*)$/))){ flushPara(); flushList(); title = title || m[1].replace(/\s+--\s+/, ": "); i++; continue; }
    if ((m = L.match(/^(#{2,3}) (.*)$/))){ flushPara(); flushList(); const hh = el(m[1].length === 2 ? "h2" : "h3"); hh.append(inlineMd(m[2], base)); body.append(hh); i++; continue; }
    if ((m = L.match(/^(\s*)(-|\d+\.) (.*)$/))){
      flushPara();
      const ordered = m[2] !== "-";
      if (!list || (list.tagName === "OL") !== ordered){ list = el(ordered ? "ol" : "ul"); body.append(list); }
      item = el("li"); item.dataset.raw = m[3]; list.append(item); i++;
      while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*(-|\d+\.) /.test(lines[i])) item.dataset.raw += " " + lines[i++].trim();
      item.append(inlineMd(item.dataset.raw, base)); delete item.dataset.raw;
      continue;
    }
    if (!L.trim()){ flushPara(); flushList(); i++; continue; }
    flushList(); para.push(L.trim()); i++;
  }
  flushPara();
  nodes.push(head(eyebrow, title, []), body);
  return nodes;
}
/* a mermaid flowchart, drawn as boxes in layers from its first node down: the same diagram GitHub shows, at the
   page's reading size, and a column on a phone */
function flowDiagram(src){
  const label = {}, edges = [];
  const node = s => { const m = s.trim().match(/^(\w+)(?:\["([^"]*)"\])?$/); if (!m) return null; if (m[2]) label[m[1]] = m[2]; return m[1]; };
  for (const line of src.split("\n")){
    const parts = line.split("-->"); if (parts.length !== 2) continue;
    const a = node(parts[0]), b = node(parts[1]); if (a && b) edges.push([a, b]);
  }
  const ids = [...new Set(edges.flat())], depth = {};
  const roots = ids.filter(id => !edges.some(e => e[1] === id));
  const walk = (id, d) => { if ((depth[id] ?? -1) >= d) return; depth[id] = d; for (const e of edges) if (e[0] === id) walk(e[1], d + 1); };
  roots.forEach(r => walk(r, 0));
  const fig = el("figure","flow"); fig.setAttribute("role","img");
  const maxD = Math.max(0, ...Object.values(depth));
  const words = [];
  for (let d = 0; d <= maxD; d++){
    if (d) fig.append(el("div","farrow","↓"));
    const row = el("div","flayer");
    for (const id of ids.filter(x => depth[x] === d)){
      const segs = (label[id] || id).split(/<br\s*\/?>/i);
      const n = el("div","fnode" + (d === 1 ? " fkey" : ""));
      n.append(el("b",null,segs[0]), el("span",null,segs.slice(1).join(" ")));
      row.append(n); words.push(segs.join(" "));
    }
    fig.append(row);
  }
  fig.setAttribute("aria-label","How it flows: " + words.join("; then "));
  return fig;
}

/* ------------------------------------------------------------ lines in equilibrium beyond six lines
   The browser balances a block of up to six lines (text-wrap: balance). A longer block, most often a paragraph on a
   phone, is narrowed here to the smallest width that keeps its number of lines, so its last line comes out full rather
   than holding a word or two alone (Zane amendment docket F-1). */
function linesOf(e){
  const r = document.createRange(); r.selectNodeContents(e);
  const tops = new Set(); let lastL = Infinity, lastR = -Infinity, maxW = 0, lastTop = -1;
  const rows = {};
  for (const x of r.getClientRects()){ if (!x.width) continue; const k = Math.round(x.top / 4); rows[k] = rows[k] || [x.left, x.right]; rows[k][0] = Math.min(rows[k][0], x.left); rows[k][1] = Math.max(rows[k][1], x.right); }
  const keys = Object.keys(rows).map(Number).sort((a,b) => a - b);
  if (!keys.length) return {n:0, ratio:1};
  const widths = keys.map(k => rows[k][1] - rows[k][0]);
  return {n: keys.length, ratio: widths.at(-1) / Math.max(...widths)};
}
function evenLast(root = document){
  for (const e of root.querySelectorAll("main p, main li, main dd, .lede, .finding")){
    if (!e.offsetParent || e.closest("pre, .code") || e.querySelector(".code, pre, ul, ol")) continue;
    e.style.maxWidth = "";
    const m = linesOf(e);
    if (m.n < 2 || m.ratio >= 0.4) continue;              /* past six lines, or where the browser's balance fell short */
    const W = e.getBoundingClientRect().width;
    let lo = W * 0.7, hi = W, best = W;
    for (let k = 0; k < 12; k++){ const mid = (lo + hi) / 2; e.style.maxWidth = mid + "px"; if (linesOf(e).n === m.n){ best = mid; hi = mid; } else lo = mid; }
    e.style.maxWidth = Math.ceil(best) + "px";
    /* when the same number of lines cannot fill the last one, one more line can: take the widest width, down to 60%,
       whose last line is at least half full */
    if (linesOf(e).ratio < 0.33){
      e.style.maxWidth = "";
      for (let f = 0.98; f >= 0.6; f -= 0.02){ e.style.maxWidth = Math.floor(W * f) + "px"; if (linesOf(e).ratio >= 0.5) break; }
      if (linesOf(e).ratio < 0.33) e.style.maxWidth = "";
    }
  }
}
let evenTimer = 0;
/* after the page is laid out, and again once the web fonts are in (they change where lines break) */
const evenSoon = root => { setTimeout(() => evenLast(root), 30); document.fonts?.ready.then(() => evenLast(root)); };

  /* the page is frozen exactly while the help is open, however it is closed (Close, Esc, a click outside) */
  const openHelp = () => help.showModal();
  new MutationObserver(() => document.documentElement.classList.toggle("locked", help.open)).observe(help, {attributes:true, attributeFilter:["open"]});
  $("#helpOpen").addEventListener("click", openHelp);
  help.addEventListener("click", e => { if (e.target === help) help.close(); });
  readerRow();
  try {
    const here = new URL(".", location.href).href;
    CONFIG = await fetch("app/config.json", {cache:"no-cache"}).then(r => { if (!r.ok) throw new Error("configuration " + r.status); return r.json(); });
    const [f, m, l] = await Promise.all([
      window.LookoutFeed.load({ base: here, fresh: true, key: CONFIG.feed.key, namespace: CONFIG.feed.namespace }),
      fetch(CONFIG.map, {cache:"no-cache"}).then(r => { if (!r.ok) throw new Error("estate map " + r.status); return r.json(); }),
      fetch("app/lessons.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : {entries:{}}).catch(() => ({entries:{}})),
      fetch("app/digests.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : []).catch(() => [])
    ]).then(([f, m, l, d]) => { DIGESTS = Array.isArray(d) ? d : []; return [f, m, l]; });
    FEED = f; MAP = m; LESSONS = l.entries || {};
  } catch (e) {
    $("#checked").textContent = "";
    $("#view").replaceChildren(head("", "The feed did not pass its check in this browser", ["Radar shows a feed only after its signature checks: " + e.message + ". Reload the page, or open it in a current browser."]));
    return;
  }
  indexMap();
  dress();
  live = FEED.items.filter(it => !["declined","superseded"].includes(it.status) && it.review_by >= today);
  const ok = el("span","ok","Signature checked in this browser"); $("#checked").replaceChildren(ok, document.createTextNode(": the feed was signed by " + poss(RADAR()) + " key " + CONFIG.feed.fingerprint.slice(0, 13) + "…" + CONFIG.feed.fingerprint.slice(-4) + " and is unchanged since. " + FEED.items.length + " entries, updated " + FEED.updated.slice(0,10) + "."));
  /* the pinned header's height, so the fixed radar sits just under it */
  const headH = window.headH = () => document.documentElement.style.setProperty("--head", document.querySelector("header.top").offsetHeight + "px");
  headH(); addEventListener("resize", headH);
  addEventListener("hashchange", () => route(false));
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => route(true));
  route(true);
  if (!store.get("helped", false)) { store.set("helped", true); openHelp(); }
}
start();
</script>
