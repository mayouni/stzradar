# lookout.yaml -- everything about this watch that belongs to its project.
#
# Lookout is a tool any project can run: a weekly survey by an agent, a signed feed, a site with a dashboard,
# and a bar other sites include. This file is the only place that says WHICH project, WHAT it watches, and
# WHAT the agent must learn first. The tools read it (haro tools/feed.ring checks it and publishes
# app/config.json for the site), and the agent reads it before every survey. docs/ADOPT.md explains each key.

lookout: 1                        # the version of this file's shape

project:                          # the project the watch serves
  name: Softanza
  site: https://mayouni.github.io/stzsite/
  owner: Mansour Ayouni
  licence: MIT
  licence_url: https://github.com/mayouni/lookout/blob/main/LICENSE
  pitch: >
    The governed software platform of the AI age: a library and its Zig engine, a declared machine
    (Harobanda), a language of languages (Haro), and the projects built on them.

# A text below may say {project}, {topic}, {watch} or {title}: it is published with this file's values in their
# place, so the watch speaks in its own project's voice. {week} names the week on an earlier week's page.

watch:                            # the watch itself
  name: Lookout                   # the tool's name: the repository, the feed format, the bar's script
  title: "{project} {topic} Radar"  # what readers see: the site's title, the feed's title, the bar's link
  topic: AI
  repository: https://github.com/mayouni/lookout
  pages: https://mayouni.github.io/lookout/
  language: en
  tagline: What changed in {topic} this week, and what it means for what we build in {project}
  tagline_past: What changed in {topic} in week {week}, and what it meant for what we build in {project}
  intro: >
    Each week the radar reads the papers, releases, security findings and practices at their source, and shows
    where each one lands in {project}: the machine (Harobanda), the language (Haro), the foundation
    (Softanza), and the projects built on them.
  schedule:
    every: monday
    at: "07:00"
    timezone: Africa/Niamey
    week: the latest ISO week that has ended
  publish: after-reading          # the owner reads the digest; only then is the feed signed and pushed
  radar_limit: 7                  # the radar highlights at most this many signals a week; the list keeps them all

home:                             # the front page: what the watch is for, before any week is shown
  headline: >
    {topic} changes every week. {project} hears what concerns it the same week.
  promise: >
    {title} reads the week's papers, releases, security findings and practices at their source, judges each
    one from {project}'s point of view, and tells us, the {project} team, what it means for us and what we
    should do about it: a check to run, a lesson to learn, or work proposed to the part it concerns.
  why: >
    {project} is the governed software platform of the AI age, so almost every development in {topic} touches
    something it builds: its library and engine, its language Haro, its declared machine Harobanda, its
    interfaces, its intelligence layer. A finding that matters reaches the part it concerns within days, as work
    someone can act on, and what was learned is written down once, with its sources, where every session,
    project and reader finds it again.
  need:
    - Which of this week's developments touch {project}, and which part of it
    - Where {project} stands on each one, to adopt, learn from, correct, defend against, watch or decline
    - What each reader does next, whether developer, maintainer, learner or user
  value:
    - Each project of {project} hears what concerns it, as a dated proposal it decides on
    - A record that lasts, every entry with its sources, its stance and its corrections
    - A signed feed any program can read, and a bar any site can show
    - The same watch for any project, from one file, lookout.yaml

feed:                             # who signs the feed (docs/FEED.md, "The signature")
  signer: feed@lookout
  namespace: lookout-feed
  fingerprint: SHA256:ZUij0xoxJIIEwH3AV5xrDXkJLuEklao7pUVhTxCs49I
  key: AAAAC3NzaC1lZDI1NTE5AAAAIJoTrtZQEdrhJQFEybJGDuZs9DxF/9X/vPE3q2WfEgDK   # the public key; keys/allowed_signers holds the same

map: map/estate.json              # the project's layers, parts, domains and concerns

readers:                          # who the notices are written for, and what each reads first
  - id: developer
    label: Developer
    first: checks and code to run in your own project come first
  - id: maintainer
    label: Maintainer
    first: what happened and the work proposed to Softanza's projects come first
  - id: learner
    label: Learner
    first: each signal opens on a lesson in plain words
  - id: user
    label: User
    first: what happened, and what it means for the software you use

agent:                            # what the watching agent learns before it reads the week
  goal: >
    Keep Softanza, and the people who build, learn and work with it, ahead of what changes in AI: read each
    development at its source, say what it means for each part of Softanza, and propose the work it calls for.
  learn:                          # read these first, every run, to know the project
    - map/estate.json
    - docs/METHOD.md
    - docs/FEED.md
    - https://mayouni.github.io/stzsite/
  in_scope:
    - new projects, libraries, languages, runtimes, agents and tools
    - papers that change how we think about programming, learning, models or safety
    - features the labs and tool makers ship
    - practices of teams and companies with AI
    - security findings and fixes in models, agents, tool protocols and supply chains
    - regulation and standards that reach software like Softanza
    - ideas the owner brings, as a link or a sentence
  out_of_scope:
    - a private person's name, a client, or anything about either
    - anything said in a private conversation, unless its author asked for it to be published
    - a key, a token, a password, or a path on the machine that runs the watch
    - a source that was not read, or a vendor's figure presented as the project's own measurement
  sources:
    - name: arXiv cs.AI, cs.CL, cs.SE, cs.CR, cs.PL
      url: https://arxiv.org/list/cs.AI/recent
    - name: Hugging Face daily papers
      url: https://huggingface.co/papers
    - name: Anthropic news
      url: https://www.anthropic.com/news
    - name: OpenAI news
      url: https://openai.com/news
    - name: Google DeepMind blog
      url: https://deepmind.google/blog/
    - name: Meta AI blog
      url: https://ai.meta.com/blog/
    - name: Mistral AI news
      url: https://mistral.ai/news
    - name: Claude Code changelog
      url: https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/CHANGELOG.md
    - name: OpenAI Codex releases
      url: https://github.com/openai/codex/releases
    - name: GitHub changelog
      url: https://github.blog/changelog/
    - name: GitHub Security Advisories
      url: https://github.com/advisories
    - name: OWASP GenAI Security Project
      url: https://genai.owasp.org/
    - name: MCP TypeScript SDK advisories
      url: https://github.com/modelcontextprotocol/typescript-sdk/security/advisories
    - name: NIST AI Risk Management Framework
      url: https://www.nist.gov/itl/ai-risk-management-framework
    - name: EU AI Act
      url: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
    - name: Simon Willison's weblog
      url: https://simonwillison.net/
    - name: Zig releases and news
      url: https://ziglang.org/
  stances:                        # what each stance means for this project
    adopt: take it into Softanza
    learn: it changes how we think, before it changes what we ship
    correct: the idea is right, and Softanza can do it better
    defend: a risk Softanza and its users must be protected from
    watch: too early; look again by the review date
    decline: considered and refused, with the reason
  rules:
    - read every development at its source before writing about it
    - write one plain sentence for each reader the entry concerns
    - place every entry on the map; the feed tool refuses a name the map does not list
    - date every proposal at each stage it reaches
    - public pages say what the project is and does, never what it lacks
  proposals:                      # where the work the agent proposes goes
    to: Softanza's maintainers
    through: Central, the session that coordinates Softanza's projects, one message per project
    never: an edit in another project's repository

checks:
  affirm: true                    # refuse public lines that list what is missing (tools/affirm-allow.txt)
